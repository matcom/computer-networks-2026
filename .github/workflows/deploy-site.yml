name: Deploy static course

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage only generated release files
        shell: python
        run: |
          import hashlib, json, pathlib, shutil
          root = pathlib.Path.cwd()
          target = root / '_pages'
          target.mkdir()
          files = json.loads((root / '.release-files.json').read_text())['files']
          for name, expected in files.items():
              if name.startswith('.') and name != '.nojekyll':
                  continue
              source = (root / name).resolve()
              assert source.is_relative_to(root) and not source.is_symlink(), name
              assert hashlib.sha256(source.read_bytes()).hexdigest() == expected, name
              destination = target / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, destination)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
