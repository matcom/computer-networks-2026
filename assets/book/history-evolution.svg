<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
<title id="title">Evolution of networking ideas relevant to Part I</title>
<desc id="desc">Timeline from telegraphy and telephony through packet switching, ARPANET, Ethernet, TCP/IP, DNS, the Web, and wireless networking, emphasizing the ideas that led to shared links, packet networks, physical media, local networks, and the modern Internet.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17324a}.h{font-size:31px;font-weight:780}.m{font-size:19px;font-weight:750}.b{font-size:16px}.s{font-size:13px;fill:#5d7280}.w{fill:#fff}
</style>
<rect width="1600" height="820" fill="#fff"/>
<text x="70" y="65" class="h">Networking evolved by solving different physical and sharing problems</text>
<text x="70" y="98" class="b">The mechanisms in Part I are easier to understand when placed in the sequence of problems that motivated them.</text>
<line x1="95" y1="310" x2="1505" y2="310" stroke="#527d91" stroke-width="6"/>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#527d91"/></marker></defs>
<line x1="1460" y1="310" x2="1515" y2="310" stroke="#527d91" stroke-width="6" marker-end="url(#a)"/>

<g transform="translate(85,145)">
 <rect width="160" height="110" rx="18" fill="#f2f7f8"/><path d="M30 72h100M55 72V38M105 72V48M48 38h14M98 48h14" stroke="#173a56" stroke-width="7" stroke-linecap="round"/><circle cx="55" cy="28" r="9" fill="#0f8b8d"/><circle cx="105" cy="38" r="9" fill="#0f8b8d"/>
 <text x="80" y="-15" text-anchor="middle" class="m">Telegraphy</text><text x="80" y="190" text-anchor="middle" class="m">1840s+</text><text x="80" y="222" text-anchor="middle" class="s">coded electrical signals</text><text x="80" y="242" text-anchor="middle" class="s">over long wires</text>
 <line x1="80" y1="165" x2="80" y2="255" stroke="#9ab4bf" stroke-width="3"/>
</g>
<g transform="translate(260,145)">
 <rect width="160" height="110" rx="18" fill="#f2f7f8"/><path d="M45 40c25 45 45 55 75 65l20-28-32-18-15 15c-12-8-22-18-30-31l14-14-17-32z" fill="#2b6e96"/>
 <text x="80" y="-15" text-anchor="middle" class="m">Telephone</text><text x="80" y="190" text-anchor="middle" class="m">1870s+</text><text x="80" y="222" text-anchor="middle" class="s">dedicated circuits</text><text x="80" y="242" text-anchor="middle" class="s">for continuous voice</text>
 <line x1="80" y1="165" x2="80" y2="255" stroke="#9ab4bf" stroke-width="3"/>
</g>
<g transform="translate(435,145)">
 <rect width="160" height="110" rx="18" fill="#f2f7f8"/><g fill="#0f8b8d"><rect x="25" y="25" width="38" height="28" rx="5"/><rect x="70" y="25" width="38" height="28" rx="5"/><rect x="115" y="25" width="20" height="28" rx="5"/><rect x="25" y="62" width="38" height="28" rx="5"/><rect x="70" y="62" width="38" height="28" rx="5"/></g><path d="M112 68h32M136 58l10 10-10 10" fill="none" stroke="#173a56" stroke-width="5"/>
 <text x="80" y="-15" text-anchor="middle" class="m">Packet switching</text><text x="80" y="190" text-anchor="middle" class="m">1960s</text><text x="80" y="222" text-anchor="middle" class="s">bursty data shares links</text><text x="80" y="242" text-anchor="middle" class="s">without reserving circuits</text>
 <line x1="80" y1="165" x2="80" y2="255" stroke="#9ab4bf" stroke-width="3"/>
</g>
<g transform="translate(610,145)">
 <rect width="160" height="110" rx="18" fill="#f2f7f8"/><g stroke="#2b6e96" stroke-width="5"><line x1="80" y1="35" x2="40" y2="78"/><line x1="80" y1="35" x2="120" y2="78"/><line x1="40" y1="78" x2="120" y2="78"/></g><g fill="#173a56"><rect x="61" y="15" width="38" height="30" rx="4"/><rect x="20" y="67" width="38" height="30" rx="4"/><rect x="102" y="67" width="38" height="30" rx="4"/></g>
 <text x="80" y="-15" text-anchor="middle" class="m">ARPANET</text><text x="80" y="190" text-anchor="middle" class="m">1969</text><text x="80" y="222" text-anchor="middle" class="s">operational packet network</text><text x="80" y="242" text-anchor="middle" class="s">and internetworking testbed</text>
 <line x1="80" y1="165" x2="80" y2="255" stroke="#9ab4bf" stroke-width="3"/>
</g>
<g transform="translate(785,145)">
 <rect width="160" height="110" rx="18" fill="#f2f7f8"/><rect x="35" y="28" width="90" height="40" rx="9" fill="#153a56"/><g fill="#d8eef2"><rect x="48" y="40" width="13" height="13"/><rect x="67" y="40" width="13" height="13"/><rect x="86" y="40" width="13" height="13"/><rect x="105" y="40" width="13" height="13"/></g><path d="M80 68v25M45 93h70" stroke="#2b6e96" stroke-width="5"/>
 <text x="80" y="-15" text-anchor="middle" class="m">Ethernet</text><text x="80" y="190" text-anchor="middle" class="m">1973+</text><text x="80" y="222" text-anchor="middle" class="s">shared local medium,</text><text x="80" y="242" text-anchor="middle" class="s">later switched LANs</text>
 <line x1="80" y1="165" x2="80" y2="255" stroke="#9ab4bf" stroke-width="3"/>
</g>
<g transform="translate(960,145)">
 <rect width="160" height="110" rx="18" fill="#f2f7f8"/><path d="M45 20h70v70H45z" fill="#fff" stroke="#2b6e96" stroke-width="4"/><path d="M55 37h50M55 52h50M55 67h30" stroke="#0f8b8d" stroke-width="5"/><text x="80" y="85" text-anchor="middle" class="s">TCP/IP</text>
 <text x="80" y="-15" text-anchor="middle" class="m">TCP/IP transition</text><text x="80" y="190" text-anchor="middle" class="m">1983</text><text x="80" y="222" text-anchor="middle" class="s">common internetworking</text><text x="80" y="242" text-anchor="middle" class="s">across diverse networks</text>
 <line x1="80" y1="165" x2="80" y2="255" stroke="#9ab4bf" stroke-width="3"/>
</g>
<g transform="translate(1135,145)">
 <rect width="160" height="110" rx="18" fill="#f2f7f8"/><g fill="#153a56"><rect x="35" y="22" width="90" height="23" rx="6"/><rect x="35" y="50" width="90" height="23" rx="6"/></g><circle cx="109" cy="83" r="17" fill="none" stroke="#2b6e96" stroke-width="4"/><path d="M92 83h34M109 66c-6 9-6 25 0 34M109 66c6 9 6 25 0 34" fill="none" stroke="#2b6e96" stroke-width="3"/>
 <text x="80" y="-15" text-anchor="middle" class="m">DNS</text><text x="80" y="190" text-anchor="middle" class="m">1984</text><text x="80" y="222" text-anchor="middle" class="s">distributed naming makes</text><text x="80" y="242" text-anchor="middle" class="s">network resources usable</text>
 <line x1="80" y1="165" x2="80" y2="255" stroke="#9ab4bf" stroke-width="3"/>
</g>
<g transform="translate(1310,145)">
 <rect width="160" height="110" rx="18" fill="#f2f7f8"/><g fill="none" stroke="#2781b6" stroke-width="8" stroke-linecap="round"><path d="M25 55c33-38 77-38 110 0"/><path d="M50 78c19-22 42-22 60 0"/></g><circle cx="80" cy="92" r="7" fill="#2781b6"/>
 <text x="80" y="-15" text-anchor="middle" class="m">Wireless LANs</text><text x="80" y="190" text-anchor="middle" class="m">1997+</text><text x="80" y="222" text-anchor="middle" class="s">shared radio links bring</text><text x="80" y="242" text-anchor="middle" class="s">mobility into local networks</text>
 <line x1="80" y1="165" x2="80" y2="255" stroke="#9ab4bf" stroke-width="3"/>
</g>

<g transform="translate(85,500)">
 <rect width="1430" height="220" rx="22" fill="#f6f9fa" stroke="#c8d8df" stroke-width="2"/>
 <text x="35" y="48" class="m">What Part I inherits from this history</text>
 <g transform="translate(35,78)">
   <rect width="315" height="105" rx="16" fill="#eaf4f6"/><text x="22" y="35" class="m">Physical limits</text><text x="22" y="63" class="s">Signals attenuate, propagate, and compete</text><text x="22" y="84" class="s">with noise regardless of protocol design.</text>
   <rect x="340" width="315" height="105" rx="16" fill="#eaf4f6"/><text x="362" y="35" class="m">Packet sharing</text><text x="362" y="63" class="s">Bursty traffic shares resources efficiently,</text><text x="362" y="84" class="s">but queues and contention appear.</text>
   <rect x="680" width="315" height="105" rx="16" fill="#eaf4f6"/><text x="702" y="35" class="m">Layered internetworking</text><text x="702" y="63" class="s">Different local technologies can carry a</text><text x="702" y="84" class="s">common packet abstraction between networks.</text>
   <rect x="1020" width="315" height="105" rx="16" fill="#eaf4f6"/><text x="1042" y="35" class="m">Local learning</text><text x="1042" y="63" class="s">LAN devices learn and forward using local</text><text x="1042" y="84" class="s">identities and limited state.</text>
 </g>
</g>
<text x="800" y="775" text-anchor="middle" class="s">Dates mark widely recognized milestones; technologies continued evolving after each point.</text>
</svg>