<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Evolution of networking ideas relevant to Part I</title><desc id="desc">An alternating timeline of major networking milestones and the ideas inherited by Part I.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17324a}
.title{font-size:36px;font-weight:750}.subtitle{font-size:18px;fill:#5c7180}.section{font-size:22px;font-weight:720}
.label{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#5c7180}.tiny{font-size:12px;fill:#5c7180}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.white{fill:#fff}.teal{fill:#0f7f82}.blue{fill:#2b6e96}.orange{fill:#c96b1b}
.card{fill:#f8fbfc;stroke:#c6d7df;stroke-width:2}.soft{fill:#edf5f7}.navy{fill:#173a56}.rule{stroke:#8fa9b6;stroke-width:3}.thin{stroke:#9db2bc;stroke-width:2}
</style><rect width="1600" height="900" fill="#fff"/><text x="64" y="62" class="title">How the ideas in Part I emerged</text><text x="64" y="94" class="subtitle">Each milestone solved a different sharing, distance, naming, or mobility problem; modern networks combine the results.</text><line x1="90" y1="355" x2="1510" y2="355" stroke="#6f8fa0" stroke-width="5"/><circle cx="115" cy="355" r="10" fill="#0f7f82"/><line x1="115" y1="345" x2="115" y2="295" stroke="#9db2bc" stroke-width="3"/><rect x="27" y="155" width="176" height="132" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><text x="115" y="185" class="label teal" text-anchor="middle">1840s+</text><text x="115" y="216" class="label" text-anchor="middle">Telegraphy</text><text x="115" y="246" class="small" text-anchor="middle">coded electrical signals</text><circle cx="310" cy="355" r="10" fill="#0f7f82"/><line x1="310" y1="365" x2="310" y2="410" stroke="#9db2bc" stroke-width="3"/><rect x="222" y="410" width="176" height="132" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><text x="310" y="440" class="label teal" text-anchor="middle">1870s+</text><text x="310" y="471" class="label" text-anchor="middle">Telephony</text><text x="310" y="501" class="small" text-anchor="middle">reserved circuits for voice</text><circle cx="505" cy="355" r="10" fill="#0f7f82"/><line x1="505" y1="345" x2="505" y2="295" stroke="#9db2bc" stroke-width="3"/><rect x="417" y="155" width="176" height="132" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><text x="505" y="185" class="label teal" text-anchor="middle">1960s</text><text x="505" y="216" class="label" text-anchor="middle">Packet switching</text><text x="505" y="246" class="small" text-anchor="middle">bursty data shares links</text><circle cx="700" cy="355" r="10" fill="#0f7f82"/><line x1="700" y1="365" x2="700" y2="410" stroke="#9db2bc" stroke-width="3"/><rect x="612" y="410" width="176" height="132" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><text x="700" y="440" class="label teal" text-anchor="middle">1969</text><text x="700" y="471" class="label" text-anchor="middle">ARPANET</text><text x="700" y="501" class="small" text-anchor="middle">operational packet network</text><circle cx="895" cy="355" r="10" fill="#0f7f82"/><line x1="895" y1="345" x2="895" y2="295" stroke="#9db2bc" stroke-width="3"/><rect x="807" y="155" width="176" height="132" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><text x="895" y="185" class="label teal" text-anchor="middle">1973+</text><text x="895" y="216" class="label" text-anchor="middle">Ethernet</text><text x="895" y="246" class="small" text-anchor="middle">shared local medium</text><circle cx="1090" cy="355" r="10" fill="#0f7f82"/><line x1="1090" y1="365" x2="1090" y2="410" stroke="#9db2bc" stroke-width="3"/><rect x="1002" y="410" width="176" height="132" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><text x="1090" y="440" class="label teal" text-anchor="middle">1983</text><text x="1090" y="471" class="label" text-anchor="middle">TCP/IP</text><text x="1090" y="501" class="small" text-anchor="middle">common internetworking</text><circle cx="1285" cy="355" r="10" fill="#0f7f82"/><line x1="1285" y1="345" x2="1285" y2="295" stroke="#9db2bc" stroke-width="3"/><rect x="1197" y="155" width="176" height="132" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><text x="1285" y="185" class="label teal" text-anchor="middle">1984</text><text x="1285" y="216" class="label" text-anchor="middle">DNS</text><text x="1285" y="246" class="small" text-anchor="middle">distributed naming</text><circle cx="1480" cy="355" r="10" fill="#0f7f82"/><line x1="1480" y1="365" x2="1480" y2="410" stroke="#9db2bc" stroke-width="3"/><rect x="1392" y="410" width="176" height="132" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><text x="1480" y="440" class="label teal" text-anchor="middle">1997+</text><text x="1480" y="471" class="label" text-anchor="middle">Wireless LANs</text><text x="1480" y="501" class="small" text-anchor="middle">shared radio + mobility</text><text x="64" y="625" class="section">What Part I inherits</text><rect x="64" y="660" width="350" height="130" rx="18" fill="#eef6f7" stroke="#c6d7df" stroke-width="2"/><text x="86" y="695" class="label">Physical limits</text><text x="86" y="725" class="body">signals attenuate, propagate,</text><text x="86" y="750" class="body">and compete with noise</text><rect x="438" y="660" width="350" height="130" rx="18" fill="#eef6f7" stroke="#c6d7df" stroke-width="2"/><text x="460" y="695" class="label">Packet sharing</text><text x="460" y="725" class="body">efficiency introduces contention</text><text x="460" y="750" class="body">and queueing</text><rect x="812" y="660" width="350" height="130" rx="18" fill="#eef6f7" stroke="#c6d7df" stroke-width="2"/><text x="834" y="695" class="label">Layered internetworking</text><text x="834" y="725" class="body">different local links can carry one IP abstraction</text><rect x="1186" y="660" width="350" height="130" rx="18" fill="#eef6f7" stroke="#c6d7df" stroke-width="2"/><text x="1208" y="695" class="label">Local learning</text><text x="1208" y="725" class="body">LAN devices learn identities</text><text x="1208" y="750" class="body">and forwarding state</text><text x="800" y="842" class="small" text-anchor="middle">Dates mark widely recognized milestones; each technology continued evolving after the date shown.</text></svg>