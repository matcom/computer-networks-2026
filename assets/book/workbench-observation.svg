<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Network workbench observation workflow</title><desc id="desc">A controlled local network and a five-step evidence-first troubleshooting workflow.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17324a}
.title{font-size:36px;font-weight:750}.subtitle{font-size:18px;fill:#5c7180}.section{font-size:22px;font-weight:720}
.label{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#5c7180}.tiny{font-size:12px;fill:#5c7180}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.white{fill:#fff}.teal{fill:#0f7f82}.blue{fill:#2b6e96}.orange{fill:#c96b1b}
.card{fill:#f8fbfc;stroke:#c6d7df;stroke-width:2}.soft{fill:#edf5f7}.navy{fill:#173a56}.rule{stroke:#8fa9b6;stroke-width:3}.thin{stroke:#9db2bc;stroke-width:2}
</style><rect width="1600" height="900" fill="#fff"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6e96"/></marker></defs><text x="64" y="62" class="title">Observe before you intervene</text><text x="64" y="94" class="subtitle">Build a baseline, ask one question, collect evidence, and change only one variable at a time.</text><rect x="64" y="130" width="1472" height="205" rx="18" fill="#f4f8f9" stroke="#c6d7df" stroke-width="2"/><text x="92" y="164" class="section">Controlled workbench topology</text><line x1="280" y1="238" x2="450" y2="238" stroke="#2b6e96" stroke-width="4" marker-end="url(#arr)"/><rect x="122" y="190" width="136" height="82" rx="14" fill="#dcebf0" stroke="#6f8fa0" stroke-width="2"/><rect x="148" y="206" width="84" height="48" rx="6" fill="#fff" stroke="#6f8fa0" stroke-width="2"/><text x="190" y="292" class="label" text-anchor="middle">Your workstation</text><text x="190" y="315" class="small" text-anchor="middle">192.168.1.10</text><line x1="630" y1="238" x2="810" y2="238" stroke="#2b6e96" stroke-width="4" marker-end="url(#arr)"/><rect x="470" y="197" width="140" height="72" rx="14" fill="#173a56"/><rect x="489" y="221" width="18" height="16" rx="3" fill="#d8eef2"/><rect x="517" y="221" width="18" height="16" rx="3" fill="#d8eef2"/><rect x="545" y="221" width="18" height="16" rx="3" fill="#d8eef2"/><rect x="573" y="221" width="18" height="16" rx="3" fill="#d8eef2"/><text x="540" y="292" class="label" text-anchor="middle">Switch</text><text x="540" y="315" class="small" text-anchor="middle">Layer-2 forwarding</text><line x1="990" y1="238" x2="1280" y2="238" stroke="#2b6e96" stroke-width="4" marker-end="url(#arr)"/><ellipse cx="900" cy="233" rx="70" ry="45" fill="#2b6e96"/><path d="M865 233h70M900 203v60M877 217l-16 16 16 16M923 217l16 16-16 16" fill="none" stroke="#fff" stroke-width="5"/><text x="900" y="292" class="label" text-anchor="middle">Gateway</text><text x="900" y="315" class="small" text-anchor="middle">192.168.1.1</text><rect x="1302" y="190" width="136" height="82" rx="14" fill="#dcebf0" stroke="#6f8fa0" stroke-width="2"/><rect x="1328" y="206" width="84" height="48" rx="6" fill="#fff" stroke="#6f8fa0" stroke-width="2"/><text x="1370" y="292" class="label" text-anchor="middle">Local test host</text><text x="1370" y="315" class="small" text-anchor="middle">192.168.1.100</text><rect x="64" y="370" width="268" height="390" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><circle cx="98" cy="407" r="20" fill="#0f7f82"/><text x="98" y="414" class="label white" text-anchor="middle">1</text><text x="128" y="414" class="label">Inspect state</text><rect x="86" y="443" width="224" height="120" rx="12" fill="#173a56"/><text x="102" y="474" class="mono white">$ observe</text><text x="102" y="503" class="mono white">evidence -> note</text><text x="102" y="532" class="mono white">result -> compare</text><circle cx="94" cy="601" r="4" fill="#0f7f82"/><text x="107" y="606" class="body">ip address / route / neigh</text><circle cx="94" cy="639" r="4" fill="#0f7f82"/><text x="107" y="644" class="body">ss for sockets</text><circle cx="94" cy="677" r="4" fill="#0f7f82"/><text x="107" y="682" class="body">Record the baseline</text><rect x="365" y="370" width="268" height="390" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><circle cx="399" cy="407" r="20" fill="#0f7f82"/><text x="399" y="414" class="label white" text-anchor="middle">2</text><text x="429" y="414" class="label">Capture traffic</text><rect x="387" y="443" width="224" height="120" rx="12" fill="#173a56"/><text x="403" y="474" class="mono white">$ observe</text><text x="403" y="503" class="mono white">evidence -> note</text><text x="403" y="532" class="mono white">result -> compare</text><circle cx="395" cy="601" r="4" fill="#0f7f82"/><text x="408" y="606" class="body">Choose interface + filter</text><circle cx="395" cy="639" r="4" fill="#0f7f82"/><text x="408" y="644" class="body">Save the observation point</text><circle cx="395" cy="677" r="4" fill="#0f7f82"/><text x="408" y="682" class="body">Do not infer unseen hops</text><rect x="666" y="370" width="268" height="390" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><circle cx="700" cy="407" r="20" fill="#0f7f82"/><text x="700" y="414" class="label white" text-anchor="middle">3</text><text x="730" y="414" class="label">Test one question</text><rect x="688" y="443" width="224" height="120" rx="12" fill="#173a56"/><text x="704" y="474" class="mono white">$ observe</text><text x="704" y="503" class="mono white">evidence -> note</text><text x="704" y="532" class="mono white">result -> compare</text><circle cx="696" cy="601" r="4" fill="#0f7f82"/><text x="709" y="606" class="body">ping / route get / curl</text><circle cx="696" cy="639" r="4" fill="#0f7f82"/><text x="709" y="644" class="body">Use the narrowest tool</text><circle cx="696" cy="677" r="4" fill="#0f7f82"/><text x="709" y="682" class="body">Write what the result proves</text><rect x="967" y="370" width="268" height="390" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><circle cx="1001" cy="407" r="20" fill="#0f7f82"/><text x="1001" y="414" class="label white" text-anchor="middle">4</text><text x="1031" y="414" class="label">Preserve evidence</text><rect x="989" y="443" width="224" height="120" rx="12" fill="#173a56"/><text x="1005" y="474" class="mono white">$ observe</text><text x="1005" y="503" class="mono white">evidence -> note</text><text x="1005" y="532" class="mono white">result -> compare</text><circle cx="997" cy="601" r="4" fill="#0f7f82"/><text x="1010" y="606" class="body">commands + outputs</text><circle cx="997" cy="639" r="4" fill="#0f7f82"/><text x="1010" y="644" class="body">timestamps + conditions</text><circle cx="997" cy="677" r="4" fill="#0f7f82"/><text x="1010" y="682" class="body">capture / notes / fixtures</text><rect x="1268" y="370" width="268" height="390" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><circle cx="1302" cy="407" r="20" fill="#0f7f82"/><text x="1302" y="414" class="label white" text-anchor="middle">5</text><text x="1332" y="414" class="label">Change one thing</text><rect x="1290" y="443" width="224" height="120" rx="12" fill="#173a56"/><text x="1306" y="474" class="mono white">$ observe</text><text x="1306" y="503" class="mono white">evidence -> note</text><text x="1306" y="532" class="mono white">result -> compare</text><circle cx="1298" cy="601" r="4" fill="#0f7f82"/><text x="1311" y="606" class="body">make one focused change</text><circle cx="1298" cy="639" r="4" fill="#0f7f82"/><text x="1311" y="644" class="body">repeat the same test</text><circle cx="1298" cy="677" r="4" fill="#0f7f82"/><text x="1311" y="682" class="body">compare with the baseline</text><rect x="64" y="792" width="1472" height="62" rx="14" fill="#e6f4f4" stroke="#b5d9d8" stroke-width="2"/><text x="800" y="819" class="label" text-anchor="middle">Evidence loop</text><text x="800" y="844" class="body" text-anchor="middle">question → prediction → observation → interpretation → one change → repeat</text></svg>