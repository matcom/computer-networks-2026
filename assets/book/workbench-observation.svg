<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Network workbench observation workflow</title>
<desc id="desc">A compact network path across the top and a five-step evidence workflow below: inspect host state, capture traffic, test one question, preserve evidence, and change one thing before retesting.</desc>
<style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#183247}
  .title{font-size:34px;font-weight:760}
  .subtitle{font-size:18px;fill:#587181}
  .card-title{font-size:20px;font-weight:750}
  .body{font-size:16px}
  .small{font-size:14px;fill:#587181}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px;fill:#eef7f9}
  .num{font-size:18px;font-weight:800;fill:white}
</style>
<rect width="1600" height="900" fill="#fff"/>
<text x="80" y="64" class="title">Observe before you intervene</text>
<text x="80" y="98" class="subtitle">Build a baseline, collect evidence, then change one variable at a time.</text>

<!-- network path -->
<rect x="80" y="135" width="1440" height="155" rx="22" fill="#f6f9fa" stroke="#d3e0e5"/>
<line x1="230" y1="215" x2="1370" y2="215" stroke="#7ea1b2" stroke-width="5" stroke-linecap="round"/>
<g transform="translate(115,166)">
  <rect width="190" height="96" rx="16" fill="#edf4f6" stroke="#9fb9c5" stroke-width="2"/>
  <rect x="28" y="18" width="134" height="56" rx="7" fill="#173a56"/>
  <text x="95" y="50" text-anchor="middle" class="mono">$ ip addr</text>
  <text x="95" y="-10" text-anchor="middle" class="card-title">Workstation</text>
</g>
<g transform="translate(470,178)">
  <rect width="170" height="72" rx="14" fill="#173a56"/>
  <g fill="#d8eef2"><rect x="24" y="26" width="24" height="18" rx="3"/><rect x="58" y="26" width="24" height="18" rx="3"/><rect x="92" y="26" width="24" height="18" rx="3"/><rect x="126" y="26" width="20" height="18" rx="3"/></g>
  <text x="85" y="-12" text-anchor="middle" class="card-title">Switch</text>
</g>
<g transform="translate(760,173)">
  <ellipse cx="80" cy="42" rx="80" ry="42" fill="#176e9b"/>
  <path d="M36 42h88M80 13v58M50 27 36 42l14 15M110 27l14 15-14 15" fill="none" stroke="#fff" stroke-width="6"/>
  <text x="80" y="-14" text-anchor="middle" class="card-title">Gateway</text>
</g>
<g transform="translate(1110,166)">
  <rect width="190" height="96" rx="16" fill="#edf4f6" stroke="#9fb9c5" stroke-width="2"/>
  <rect x="34" y="18" width="122" height="56" rx="7" fill="#bdd9e5" stroke="#365b72" stroke-width="3"/>
  <text x="95" y="50" text-anchor="middle" class="body">test host</text>
  <text x="95" y="-10" text-anchor="middle" class="card-title">Peer</text>
</g>
<text x="355" y="205" text-anchor="middle" class="small">local link</text>
<text x="700" y="205" text-anchor="middle" class="small">forwarding</text>
<text x="1015" y="205" text-anchor="middle" class="small">controlled LAN</text>

<!-- aligned workflow cards -->
<g transform="translate(80,335)">
  <rect width="264" height="430" rx="20" fill="#f8fbfc" stroke="#cfdee4"/>
  <circle cx="34" cy="38" r="21" fill="#0f8b8d"/><text x="34" y="45" text-anchor="middle" class="num">1</text>
  <text x="68" y="45" class="card-title">Inspect host state</text>
  <text x="24" y="82" class="small">What does the kernel know now?</text>
  <rect x="24" y="108" width="216" height="155" rx="12" fill="#132b3f"/>
  <text x="40" y="138" class="mono">$ ip addr</text>
  <text x="40" y="168" class="mono">wlan0: UP</text>
  <text x="40" y="198" class="mono">192.168.1.10/24</text>
  <text x="40" y="230" class="mono">$ ip route</text>
  <text x="40" y="250" class="mono">default via 192.168.1.1</text>
  <text x="24" y="306" class="body">Record:</text>
  <text x="24" y="336" class="small">• interface and address</text>
  <text x="24" y="362" class="small">• route and next hop</text>
  <text x="24" y="388" class="small">• neighbor / socket state</text>
</g>

<g transform="translate(374,335)">
  <rect width="264" height="430" rx="20" fill="#f8fbfc" stroke="#cfdee4"/>
  <circle cx="34" cy="38" r="21" fill="#0f8b8d"/><text x="34" y="45" text-anchor="middle" class="num">2</text>
  <text x="68" y="45" class="card-title">Capture traffic</text>
  <text x="24" y="82" class="small">Name exactly where you observe.</text>
  <rect x="24" y="108" width="216" height="155" rx="12" fill="#132b3f"/>
  <text x="40" y="138" class="mono">$ tcpdump -ni wlan0</text>
  <text x="40" y="170" class="mono">ARP who-has 192.168.1.1</text>
  <text x="40" y="202" class="mono">ICMP echo request</text>
  <path d="M42 244v-18M72 244v-44M102 244v-26M132 244v-58M162 244v-35M192 244v-66" stroke="#58c4d0" stroke-width="8"/>
  <text x="24" y="306" class="body">Record:</text>
  <text x="24" y="336" class="small">• host / namespace</text>
  <text x="24" y="362" class="small">• interface and filter</text>
  <text x="24" y="388" class="small">• timestamp and direction</text>
</g>

<g transform="translate(668,335)">
  <rect width="264" height="430" rx="20" fill="#f8fbfc" stroke="#cfdee4"/>
  <circle cx="34" cy="38" r="21" fill="#0f8b8d"/><text x="34" y="45" text-anchor="middle" class="num">3</text>
  <text x="68" y="45" class="card-title">Test one question</text>
  <text x="24" y="82" class="small">Use the narrowest useful tool.</text>
  <rect x="24" y="108" width="216" height="155" rx="12" fill="#132b3f"/>
  <text x="40" y="138" class="mono">$ ping 192.168.1.100</text>
  <text x="40" y="168" class="mono">time=0.4 ms</text>
  <text x="40" y="202" class="mono">$ ip route get 8.8.8.8</text>
  <text x="40" y="232" class="mono">via 192.168.1.1</text>
  <text x="24" y="306" class="body">Interpret carefully:</text>
  <text x="24" y="336" class="small">a successful observation proves</text>
  <text x="24" y="362" class="small">only what that tool and vantage</text>
  <text x="24" y="388" class="small">point can actually establish.</text>
</g>

<g transform="translate(962,335)">
  <rect width="264" height="430" rx="20" fill="#f8fbfc" stroke="#cfdee4"/>
  <circle cx="34" cy="38" r="21" fill="#0f8b8d"/><text x="34" y="45" text-anchor="middle" class="num">4</text>
  <text x="68" y="45" class="card-title">Preserve evidence</text>
  <text x="24" y="82" class="small">Save the baseline before changing it.</text>
  <g transform="translate(42,128)">
    <path d="M0 0h58l16 16v74H0z" fill="#fff" stroke="#8faab6" stroke-width="2"/>
    <path d="M58 0v16h16" fill="none" stroke="#8faab6" stroke-width="2"/>
    <text x="96" y="34" class="body">capture.pcap</text>
    <text x="96" y="58" class="small">packet evidence</text>
    <path d="M0 116h58l16 16v74H0z" fill="#fff" stroke="#8faab6" stroke-width="2"/>
    <path d="M58 116v16h16" fill="none" stroke="#8faab6" stroke-width="2"/>
    <text x="96" y="150" class="body">baseline.txt</text>
    <text x="96" y="174" class="small">commands + outputs</text>
  </g>
  <text x="24" y="346" class="small">Keep test conditions and your</text>
  <text x="24" y="372" class="small">prediction with the evidence.</text>
</g>

<g transform="translate(1256,335)">
  <rect width="264" height="430" rx="20" fill="#f8fbfc" stroke="#cfdee4"/>
  <circle cx="34" cy="38" r="21" fill="#0f8b8d"/><text x="34" y="45" text-anchor="middle" class="num">5</text>
  <text x="68" y="45" class="card-title">Change one thing</text>
  <text x="24" y="82" class="small">Intervene only after the baseline.</text>
  <rect x="24" y="108" width="216" height="118" rx="12" fill="#132b3f"/>
  <text x="40" y="140" class="mono">$ sudo ip route add …</text>
  <text x="40" y="176" class="mono"># one focused change</text>
  <text x="40" y="206" class="mono">$ ping 192.168.1.100</text>
  <rect x="24" y="254" width="216" height="84" rx="12" fill="#e4f4f0" stroke="#b3d9d0"/>
  <circle cx="54" cy="296" r="17" fill="#0f8b8d"/><path d="M46 296l6 6 11-13" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="82" y="290" class="body">Retest the same</text>
  <text x="82" y="316" class="body">question.</text>
  <text x="24" y="378" class="small">Compare new evidence against</text>
  <text x="24" y="404" class="small">the saved baseline.</text>
</g>

<rect x="80" y="800" width="1440" height="58" rx="16" fill="#e8f5f6"/>
<text x="800" y="836" text-anchor="middle" class="body"><tspan font-weight="750">Evidence loop:</tspan> question → prediction → observation → interpretation → one change → repeat</text>
</svg>