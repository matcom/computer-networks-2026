<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Networking workbench</title><desc id="d">Laptop with terminal and packet capture, connected to a switch and router for local network observation.</desc>
