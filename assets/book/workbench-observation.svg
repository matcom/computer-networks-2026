<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Network workbench observation workflow</title>
<desc id="desc">A workstation connected through a switch and router to a local test host, followed by five evidence-driven troubleshooting steps: inspect host state, capture traffic, test connectivity, preserve evidence, and only then change configuration.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17324a}
.h{font-size:30px;font-weight:760}.k{font-size:18px;font-weight:720;fill:#0a6675}.b{font-size:18px}.s{font-size:15px;fill:#5d7280}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:15px;fill:#eaf5f7}.n{font-size:23px;font-weight:800;fill:white}
</style>
<rect width="1600" height="900" fill="#fff"/>
<text x="70" y="72" class="h">Observe before you intervene</text>
<text x="70" y="105" class="b">A reliable network diagnosis starts with local state and reproducible evidence.</text>

<!-- topology -->
<line x1="200" y1="205" x2="1400" y2="205" stroke="#6aa9b8" stroke-width="7" stroke-linecap="round"/>
<g transform="translate(80,135)">
  <rect x="0" y="0" width="210" height="120" rx="18" fill="#eef5f7" stroke="#9bb7c2" stroke-width="3"/>
  <rect x="28" y="22" width="154" height="70" rx="8" fill="#153a56"/>
  <rect x="43" y="34" width="124" height="45" rx="5" fill="#0d2233"/>
  <text x="105" y="58" text-anchor="middle" class="mono">$ ip addr</text>
  <path d="M65 98h80l18 15H47z" fill="#597c92"/>
  <text x="105" y="-15" text-anchor="middle" class="k">Your workstation</text>
</g>
<g transform="translate(430,165)">
  <rect x="0" y="0" width="190" height="82" rx="16" fill="#153a56"/>
  <g fill="#d8eef2"><rect x="25" y="29" width="24" height="20" rx="3"/><rect x="58" y="29" width="24" height="20" rx="3"/><rect x="91" y="29" width="24" height="20" rx="3"/><rect x="124" y="29" width="24" height="20" rx="3"/></g>
  <text x="95" y="-15" text-anchor="middle" class="k">Switch</text>
</g>
<g transform="translate(750,155)">
  <ellipse cx="95" cy="50" rx="95" ry="50" fill="#176e9b"/>
  <path d="M45 50h100M95 15v70M62 32l-17 18 17 18M128 32l17 18-17 18M78 32l17-17 17 17M78 68l17 17 17-17" fill="none" stroke="#fff" stroke-width="7" stroke-linejoin="round"/>
  <text x="95" y="-8" text-anchor="middle" class="k">Router / gateway</text>
</g>
<g transform="translate(1260,137)">
  <rect x="0" y="0" width="210" height="118" rx="18" fill="#eef5f7" stroke="#9bb7c2" stroke-width="3"/>
  <rect x="35" y="20" width="140" height="72" rx="7" fill="#bdd9e5" stroke="#365b72" stroke-width="4"/>
  <rect x="86" y="92" width="38" height="8" fill="#365b72"/><rect x="67" y="100" width="76" height="8" rx="4" fill="#365b72"/>
  <text x="105" y="-15" text-anchor="middle" class="k">Local test host</text>
  <text x="105" y="140" text-anchor="middle" class="s">192.168.1.100</text>
</g>
<text x="350" y="190" text-anchor="middle" class="s">Ethernet / Wi-Fi</text>
<text x="1090" y="190" text-anchor="middle" class="s">Controlled LAN</text>

<!-- workflow -->
<g transform="translate(55,330)">
  <g>
    <rect width="280" height="420" rx="22" fill="#f5f9fa" stroke="#c6d7df" stroke-width="2"/>
    <circle cx="38" cy="40" r="23" fill="#0f8b8d"/><text x="38" y="48" text-anchor="middle" class="n">1</text>
    <text x="78" y="48" class="h" font-size="24">Inspect host state</text>
    <text x="24" y="82" class="s">What does the kernel know now?</text>
    <rect x="22" y="112" width="236" height="190" rx="12" fill="#132b3f"/>
    <text x="38" y="142" class="mono">$ ip addr</text><text x="38" y="171" class="mono">wlan0: UP</text><text x="38" y="198" class="mono">192.168.1.10/24</text>
    <text x="38" y="236" class="mono">$ ip route</text><text x="38" y="264" class="mono">default via 192.168.1.1</text>
    <text x="24" y="334" class="b">Record:</text>
    <text x="24" y="360" class="s">interface • address • route • neighbor</text>
    <text x="24" y="385" class="s">socket/listener state when relevant</text>
  </g>
  <g transform="translate(305,0)">
    <rect width="280" height="420" rx="22" fill="#f5f9fa" stroke="#c6d7df" stroke-width="2"/>
    <circle cx="38" cy="40" r="23" fill="#0f8b8d"/><text x="38" y="48" text-anchor="middle" class="n">2</text>
    <text x="78" y="48" class="h" font-size="24">Capture traffic</text>
    <text x="24" y="82" class="s">Observe the packets at one named point.</text>
    <rect x="22" y="112" width="236" height="190" rx="12" fill="#132b3f"/>
    <text x="38" y="142" class="mono">$ tcpdump -ni wlan0</text>
    <text x="38" y="177" class="mono">ARP who-has 192.168.1.1</text>
    <text x="38" y="205" class="mono">IP 192.168.1.10 &gt; 1.1.1.1</text>
    <text x="38" y="233" class="mono">ICMP echo request</text>
    <path d="M40 282v-30M68 282v-55M96 282v-20M124 282v-70M152 282v-42M180 282v-84M208 282v-31" stroke="#57c6d1" stroke-width="8"/>
    <text x="24" y="334" class="b">Name the observation point:</text>
    <text x="24" y="360" class="s">host • namespace • interface • time</text>
  </g>
  <g transform="translate(610,0)">
    <rect width="280" height="420" rx="22" fill="#f5f9fa" stroke="#c6d7df" stroke-width="2"/>
    <circle cx="38" cy="40" r="23" fill="#0f8b8d"/><text x="38" y="48" text-anchor="middle" class="n">3</text>
    <text x="78" y="48" class="h" font-size="24">Test one question</text>
    <text x="24" y="82" class="s">Use the narrowest tool that can answer it.</text>
    <rect x="22" y="112" width="236" height="190" rx="12" fill="#132b3f"/>
    <text x="38" y="142" class="mono">$ ping 192.168.1.100</text>
    <text x="38" y="170" class="mono">64 bytes ... time=0.4 ms</text>
    <text x="38" y="205" class="mono">$ ip route get 8.8.8.8</text>
    <text x="38" y="233" class="mono">via 192.168.1.1 dev wlan0</text>
    <text x="38" y="268" class="mono">$ curl -I http://host</text>
    <text x="38" y="296" class="mono">HTTP/1.1 200 OK</text>
    <text x="24" y="334" class="b">Interpret conservatively:</text>
    <text x="24" y="360" class="s">a reply proves a reply—not the whole path</text>
  </g>
  <g transform="translate(915,0)">
    <rect width="280" height="420" rx="22" fill="#f5f9fa" stroke="#c6d7df" stroke-width="2"/>
    <circle cx="38" cy="40" r="23" fill="#0f8b8d"/><text x="38" y="48" text-anchor="middle" class="n">4</text>
    <text x="78" y="48" class="h" font-size="24">Preserve evidence</text>
    <text x="24" y="82" class="s">Save observations before changing state.</text>
    <g transform="translate(36,125)" fill="#fff" stroke="#87a8b7" stroke-width="2">
      <path d="M0 0h54l18 18v72H0z"/><path d="M54 0v18h18" fill="none"/>
      <path d="M0 110h54l18 18v72H0z"/><path d="M54 110v18h18" fill="none"/>
    </g>
    <text x="125" y="162" class="b">capture.pcap</text><text x="125" y="188" class="s">packet evidence</text>
    <text x="125" y="272" class="b">baseline.txt</text><text x="125" y="298" class="s">commands + outputs</text>
    <text x="24" y="350" class="s">Keep timestamps, interface names,</text><text x="24" y="375" class="s">test conditions, and your prediction.</text>
  </g>
  <g transform="translate(1220,0)">
    <rect width="280" height="420" rx="22" fill="#f5f9fa" stroke="#c6d7df" stroke-width="2"/>
    <circle cx="38" cy="40" r="23" fill="#0f8b8d"/><text x="38" y="48" text-anchor="middle" class="n">5</text>
    <text x="78" y="48" class="h" font-size="24">Change one thing</text>
    <text x="24" y="82" class="s">Intervene only after the baseline is clear.</text>
    <rect x="22" y="112" width="236" height="150" rx="12" fill="#132b3f"/>
    <text x="38" y="142" class="mono">$ sudo ip route add ...</text>
    <text x="38" y="182" class="mono"># one focused change</text>
    <text x="38" y="222" class="mono">$ ping 192.168.1.100</text>
    <rect x="22" y="282" width="236" height="74" rx="12" fill="#e2f5f1" stroke="#a5d7cc"/>
    <circle cx="50" cy="319" r="18" fill="#0f8b8d"/><path d="M41 319l7 7 13-16" fill="none" stroke="#fff" stroke-width="5"/>
    <text x="78" y="314" class="b">Retest the same question.</text>
    <text x="78" y="338" class="s">Compare with the baseline.</text>
    <text x="24" y="390" class="s">Do not change several variables at once.</text>
  </g>
</g>

<rect x="75" y="790" width="1450" height="65" rx="18" fill="#e8f5f6"/>
<text x="800" y="818" text-anchor="middle" class="k">Evidence loop</text>
<text x="800" y="844" text-anchor="middle" class="b">question → prediction → observation → interpretation → one change → repeat</text>
</svg>