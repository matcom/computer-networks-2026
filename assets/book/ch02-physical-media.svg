<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Physical media and the signals they carry</title>
<desc id="desc">Four aligned cards compare twisted-pair copper, coaxial cable, optical fiber, and wireless radio by physical phenomenon, signal behavior, strengths, trade-offs, and typical uses.</desc>
<style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#183247}
  .title{font-size:34px;font-weight:760}.subtitle{font-size:18px;fill:#587181}
  .head{font-size:21px;font-weight:760}.label{font-size:14px;font-weight:760;fill:#0a6675;text-transform:uppercase;letter-spacing:.04em}
  .body{font-size:16px}.small{font-size:14px;fill:#587181}
</style>
<rect width="1600" height="920" fill="#fff"/>
<text x="80" y="64" class="title">The network carries bits; the medium carries physics</text>
<text x="80" y="98" class="subtitle">Copper, glass, and air expose different limits in reach, interference, capacity, mobility, and cost.</text>

<!-- four aligned cards -->
<g transform="translate(70,145)">
  <rect width="345" height="700" rx="22" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <rect width="345" height="78" rx="22" fill="#eaf4f6"/>
  <text x="172.5" y="33" text-anchor="middle" class="head">Twisted-pair copper</text>
  <text x="172.5" y="58" text-anchor="middle" class="small">common Ethernet cabling</text>
  <path d="M66 125c35-34 58 34 93 0s58 34 93 0" fill="none" stroke="#197bb5" stroke-width="10"/>
  <path d="M66 149c35 34 58-34 93 0s58-34 93 0" fill="none" stroke="#d97824" stroke-width="10"/>
  <text x="28" y="205" class="label">What travels</text>
  <text x="28" y="234" class="body">Electrical voltage/current changes</text>
  <text x="28" y="280" class="label">Conceptual signal</text>
  <path d="M35 335h42v-45h48v45h48v-45h48v45h82" fill="none" stroke="#0f8b8d" stroke-width="6"/>
  <line x1="35" y1="350" x2="310" y2="350" stroke="#9fb4be" stroke-width="2"/>
  <text x="28" y="395" class="label">Strengths</text>
  <text x="28" y="424" class="body">• inexpensive and easy to terminate</text>
  <text x="28" y="452" class="body">• excellent for building LANs</text>
  <text x="28" y="500" class="label">Trade-offs</text>
  <text x="28" y="529" class="body">• attenuation increases with length</text>
  <text x="28" y="557" class="body">• electromagnetic noise can matter</text>
  <text x="28" y="605" class="label">Typical use</text>
  <rect x="28" y="625" width="289" height="48" rx="12" fill="#edf5f7"/>
  <text x="172.5" y="655" text-anchor="middle" class="body">desktop and campus Ethernet</text>
</g>

<g transform="translate(445,145)">
  <rect width="345" height="700" rx="22" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <rect width="345" height="78" rx="22" fill="#eaf4f6"/>
  <text x="172.5" y="33" text-anchor="middle" class="head">Coaxial cable</text>
  <text x="172.5" y="58" text-anchor="middle" class="small">shielded copper geometry</text>
  <rect x="54" y="119" width="180" height="52" rx="26" fill="#203e55"/>
  <rect x="222" y="126" width="55" height="38" rx="19" fill="#c9d8df"/>
  <rect x="267" y="136" width="34" height="18" rx="9" fill="#c7792b"/>
  <line x1="68" y1="145" x2="268" y2="145" stroke="#d8eef2" stroke-width="7"/>
  <text x="28" y="205" class="label">What travels</text>
  <text x="28" y="234" class="body">Electrical field around a conductor</text>
  <text x="28" y="280" class="label">Conceptual signal</text>
  <path d="M40 323c22-40 44 40 66 0s44 40 66 0 44 40 66 0 44 40 62 0" fill="none" stroke="#0f8b8d" stroke-width="6"/>
  <line x1="35" y1="350" x2="310" y2="350" stroke="#9fb4be" stroke-width="2"/>
  <text x="28" y="395" class="label">Strengths</text>
  <text x="28" y="424" class="body">• strong shielding</text>
  <text x="28" y="452" class="body">• useful over longer copper runs</text>
  <text x="28" y="500" class="label">Trade-offs</text>
  <text x="28" y="529" class="body">• bulkier than twisted pair</text>
  <text x="28" y="557" class="body">• shared systems need careful design</text>
  <text x="28" y="605" class="label">Typical use</text>
  <rect x="28" y="625" width="289" height="48" rx="12" fill="#edf5f7"/>
  <text x="172.5" y="648" text-anchor="middle" class="body">cable access / RF distribution</text>
  <text x="172.5" y="668" text-anchor="middle" class="small">and legacy shared Ethernet</text>
</g>

<g transform="translate(820,145)">
  <rect width="345" height="700" rx="22" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <rect width="345" height="78" rx="22" fill="#eaf4f6"/>
  <text x="172.5" y="33" text-anchor="middle" class="head">Optical fiber</text>
  <text x="172.5" y="58" text-anchor="middle" class="small">glass guides light</text>
  <rect x="55" y="121" width="170" height="48" rx="24" fill="#173a56"/>
  <rect x="211" y="128" width="56" height="34" rx="17" fill="#83c9e6"/>
  <g stroke="#4bb8ee" stroke-width="6"><line x1="262" y1="132" x2="306" y2="115"/><line x1="262" y1="145" x2="310" y2="145"/><line x1="262" y1="158" x2="306" y2="175"/></g>
  <text x="28" y="205" class="label">What travels</text>
  <text x="28" y="234" class="body">Light pulses guided through glass</text>
  <text x="28" y="280" class="label">Conceptual signal</text>
  <path d="M38 350h28c8-55 24-55 32 0h48c8-55 24-55 32 0h48c8-55 24-55 32 0h49" fill="none" stroke="#2781b6" stroke-width="6"/>
  <text x="28" y="395" class="label">Strengths</text>
  <text x="28" y="424" class="body">• very high capacity and long reach</text>
  <text x="28" y="452" class="body">• immune to electromagnetic noise</text>
  <text x="28" y="500" class="label">Trade-offs</text>
  <text x="28" y="529" class="body">• optics and connectors need precision</text>
  <text x="28" y="557" class="body">• bends and contamination matter</text>
  <text x="28" y="605" class="label">Typical use</text>
  <rect x="28" y="625" width="289" height="48" rx="12" fill="#edf5f7"/>
  <text x="172.5" y="648" text-anchor="middle" class="body">backbones / data centers</text>
  <text x="172.5" y="668" text-anchor="middle" class="small">and long-distance access</text>
</g>

<g transform="translate(1195,145)">
  <rect width="335" height="700" rx="22" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <rect width="335" height="78" rx="22" fill="#eaf4f6"/>
  <text x="167.5" y="33" text-anchor="middle" class="head">Wireless radio</text>
  <text x="167.5" y="58" text-anchor="middle" class="small">shared electromagnetic spectrum</text>
  <g transform="translate(95,110)" fill="none" stroke="#2781b6" stroke-width="9" stroke-linecap="round">
    <path d="M0 43c42-43 103-43 145 0"/><path d="M28 68c26-27 63-27 89 0"/><path d="M58 91c10-10 20-10 30 0"/>
  </g>
  <circle cx="168" cy="203" r="7" fill="#2781b6"/>
  <text x="28" y="235" class="label">What travels</text>
  <text x="28" y="264" class="body">Electromagnetic waves through space</text>
  <text x="28" y="310" class="label">Conceptual signal</text>
  <path d="M38 353c17-42 34 42 51 0s34 42 51 0 34-42 51 0 34 42 51 0 34-42 51 0" fill="none" stroke="#0f8b8d" stroke-width="6"/>
  <text x="28" y="395" class="label">Strengths</text>
  <text x="28" y="424" class="body">• mobility and rapid deployment</text>
  <text x="28" y="452" class="body">• one transmitter covers an area</text>
  <text x="28" y="500" class="label">Trade-offs</text>
  <text x="28" y="529" class="body">• interference varies over time</text>
  <text x="28" y="557" class="body">• users share available capacity</text>
  <text x="28" y="605" class="label">Typical use</text>
  <rect x="28" y="625" width="279" height="48" rx="12" fill="#edf5f7"/>
  <text x="167.5" y="648" text-anchor="middle" class="body">Wi-Fi / cellular / IoT</text>
  <text x="167.5" y="668" text-anchor="middle" class="small">and point-to-point radio</text>
</g>

<rect x="80" y="870" width="1440" height="34" rx="10" fill="#e8f5f6"/>
<text x="800" y="893" text-anchor="middle" class="body"><tspan font-weight="750">Choose by constraints:</tspan> reach • capacity • environment • mobility • reliability • cost</text>
</svg>