</style><rect width="1600" height="1000" fill="#fff"/><text x="64" y="62" class="title">Physical media: same bits, different physics</text><text x="64" y="94" class="subtitle">The link layer sees frames; the medium carries electrical, optical, or radio signals with different limits and engineering trade-offs.</text><rect x="64" y="150" width="716" height="320" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><rect x="64" y="150" width="716" height="58" rx="18" fill="#edf5f7"/><text x="92" y="187" class="section">Twisted-pair copper</text><rect x="92" y="232" width="230" height="190" rx="14" fill="#fff" stroke="#d4e0e5"/><path d="M116 282c35-34 55 34 90 0s55 34 90 0" fill="none" stroke="#2b6e96" stroke-width="8"/><path d="M116 308c35 34 55-34 90 0s55-34 90 0" fill="none" stroke="#c96b1b" stroke-width="8"/><path d="M116 370h34v-34h38v34h38v-34h38v34h34" fill="none" stroke="#0f7f82" stroke-width="5"/><text x="350" y="255" class="label">What travels</text><text x="350" y="282" class="body">electrical voltage/current</text><text x="350" y="326" class="label">Strengths</text><text x="350" y="353" class="body">low cost • easy termination</text><text x="350" y="397" class="label">Trade-offs</text><text x="350" y="424" class="body">attenuation • EMI/crosstalk</text><text x="350" y="454" class="label">Typical use</text><text x="474" y="454" class="small">desktop and campus Ethernet</text><rect x="820" y="150" width="716" height="320" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><rect x="820" y="150" width="716" height="58" rx="18" fill="#edf5f7"/><text x="848" y="187" class="section">Coaxial cable</text><rect x="848" y="232" width="230" height="190" rx="14" fill="#fff" stroke="#d4e0e5"/><rect x="872" y="278" width="150" height="42" rx="21" fill="#173a56"/><rect x="1007" y="285" width="46" height="28" rx="14" fill="#ccd9df"/><rect x="1045" y="294" width="25" height="10" rx="5" fill="#c96b1b"/><path d="M872 372c22-30 44 30 66 0s44 30 66 0 44 30 44 0" fill="none" stroke="#0f7f82" stroke-width="5"/><text x="1106" y="255" class="label">What travels</text><text x="1106" y="282" class="body">electrical field in shielded geometry</text><text x="1106" y="326" class="label">Strengths</text><text x="1106" y="353" class="body">good shielding • controlled impedance</text><text x="1106" y="397" class="label">Trade-offs</text><text x="1106" y="424" class="body">bulkier • shared-medium design</text><text x="1106" y="454" class="label">Typical use</text><text x="1230" y="454" class="small">cable access • RF • legacy LANs</text><rect x="64" y="520" width="716" height="320" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><rect x="64" y="520" width="716" height="58" rx="18" fill="#edf5f7"/><text x="92" y="557" class="section">Optical fiber</text><rect x="92" y="602" width="230" height="190" rx="14" fill="#fff" stroke="#d4e0e5"/><rect x="116" y="648" width="144" height="40" rx="20" fill="#173a56"/><rect x="249" y="654" width="44" height="28" rx="14" fill="#8bc8e2"/><line x1="294" y1="668" x2="314" y2="654" stroke="#49b7ee" stroke-width="5"/><line x1="294" y1="668" x2="318" y2="668" stroke="#49b7ee" stroke-width="5"/><line x1="294" y1="668" x2="314" y2="682" stroke="#49b7ee" stroke-width="5"/><path d="M116 742h25c7-38 20-38 27 0h40c7-38 20-38 27 0h40" fill="none" stroke="#2b6e96" stroke-width="5"/><text x="350" y="625" class="label">What travels</text><text x="350" y="652" class="body">light guided through glass</text><text x="350" y="696" class="label">Strengths</text><text x="350" y="723" class="body">high capacity • long reach • no EMI</text><text x="350" y="767" class="label">Trade-offs</text><text x="350" y="794" class="body">connector/optic precision • bend loss</text><text x="350" y="824" class="label">Typical use</text><text x="474" y="824" class="small">backbones • data centers • access</text><rect x="820" y="520" width="716" height="320" rx="18" fill="#f8fbfc" stroke="#c6d7df" stroke-width="2"/><rect x="820" y="520" width="716" height="58" rx="18" fill="#edf5f7"/><text x="848" y="557" class="section">Wireless radio</text><rect x="848" y="602" width="230" height="190" rx="14" fill="#fff" stroke="#d4e0e5"/><path d="M896 686c42-48 88-48 130 0M921 710c25-26 55-26 80 0" fill="none" stroke="#2b6e96" stroke-width="8" stroke-linecap="round"/><circle cx="961" cy="730" r="7" fill="#2b6e96"/><path d="M872 762c16-28 32 28 48 0s32 28 48 0 32-28 48 0 32 28 48 0" fill="none" stroke="#0f7f82" stroke-width="5"/><text x="1106" y="625" class="label">What travels</text><text x="1106" y="652" class="body">electromagnetic waves through space</text><text x="1106" y="696" class="label">Strengths</text><text x="1106" y="723" class="body">mobility • rapid deployment</text><text x="1106" y="767" class="label">Trade-offs</text><text x="1106" y="794" class="body">interference • obstacles • shared airtime</text><text x="1106" y="824" class="label">Typical use</text><text x="1230" y="824" class="small">Wi‑Fi • cellular • IoT</text><rect x="64" y="890" width="1472" height="55" rx="14" fill="#e6f4f4" stroke="#b5d9d8" stroke-width="2"/><text x="800" y="924" class="body" text-anchor="middle">Choose media by reach, capacity, environment, mobility, cost, and reliability—not by one headline rate.</text></svg>