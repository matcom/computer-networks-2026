<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Components of end-to-end network delay</title>
<desc id="desc">A sender, router, link, and receiver illustrate four aligned delay components: processing, queueing, transmission, and propagation. Transmission is L over R; propagation is d over s.</desc>
<style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#183247}
  .title{font-size:34px;font-weight:760}.subtitle{font-size:18px;fill:#587181}
  .head{font-size:20px;font-weight:760}.body{font-size:16px}.small{font-size:14px;fill:#587181}
  .formula{font-family:Georgia,serif;font-size:30px;font-style:italic}.white{fill:#fff}
</style>
<rect width="1600" height="900" fill="#fff"/>
<text x="80" y="64" class="title">End-to-end delay is the sum of different mechanisms</text>
<text x="80" y="98" class="subtitle">Processing, queueing, transmission, and propagation come from different resources and respond to different fixes.</text>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#2b6e96"/></marker></defs>

<!-- path -->
<rect x="80" y="135" width="1440" height="180" rx="22" fill="#f7fafb" stroke="#d1dfe5"/>
<line x1="220" y1="225" x2="1380" y2="225" stroke="#6f92a4" stroke-width="5" marker-end="url(#a)"/>
<g transform="translate(120,170)">
  <rect width="180" height="110" rx="16" fill="#edf4f6" stroke="#9fb9c5" stroke-width="2"/>
  <rect x="28" y="18" width="124" height="60" rx="7" fill="#bdd9e5" stroke="#365b72" stroke-width="3"/>
  <text x="90" y="-12" text-anchor="middle" class="head">Sender</text>
</g>
<g transform="translate(520,173)">
  <ellipse cx="82" cy="48" rx="82" ry="48" fill="#176e9b"/>
  <path d="M38 48h88M82 15v66M52 31 38 48l14 17M112 31l14 17-14 17" fill="none" stroke="#fff" stroke-width="6"/>
  <rect x="14" y="112" width="136" height="36" rx="9" fill="#e8eff2"/>
  <g fill="#a9bcc6"><rect x="25" y="121" width="22" height="18" rx="3"/><rect x="54" y="121" width="22" height="18" rx="3"/><rect x="83" y="121" width="22" height="18" rx="3"/></g>
  <rect x="112" y="121" width="25" height="18" rx="3" fill="#0f8b8d"/>
  <text x="82" y="-12" text-anchor="middle" class="head">Router</text>
  <text x="82" y="170" text-anchor="middle" class="small">output queue</text>
</g>
<g transform="translate(900,188)">
  <rect width="140" height="72" rx="12" fill="#0f8b8d"/>
  <text x="70" y="44" text-anchor="middle" class="head white">L bits</text>
  <text x="70" y="-12" text-anchor="middle" class="small">link rate R</text>
</g>
<g transform="translate(1295,165)">
  <rect width="165" height="120" rx="16" fill="#173a56"/>
  <g stroke="#87a8b7" stroke-width="3"><line x1="24" y1="38" x2="118" y2="38"/><line x1="24" y1="66" x2="118" y2="66"/><line x1="24" y1="94" x2="118" y2="94"/></g>
  <g fill="#78c9bd"><circle cx="135" cy="38" r="6"/><circle cx="135" cy="66" r="6"/><circle cx="135" cy="94" r="6"/></g>
  <text x="82.5" y="-12" text-anchor="middle" class="head">Receiver</text>
</g>
<text x="1150" y="205" text-anchor="middle" class="small">distance d</text>
<text x="1150" y="245" text-anchor="middle" class="small">signal speed s</text>

<!-- four equal cards -->
<g transform="translate(65,365)">
  <rect width="345" height="390" rx="20" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <circle cx="34" cy="38" r="21" fill="#0f8b8d"/><text x="34" y="45" text-anchor="middle" class="head white">1</text>
  <text x="70" y="45" class="head">Processing</text>
  <text x="24" y="86" class="body">Inspect the packet and decide</text>
  <text x="24" y="111" class="body">what should happen next.</text>
  <rect x="52" y="145" width="92" height="62" rx="11" fill="#dcebf0"/>
  <path d="M72 166h52M72 185h34" stroke="#5c7b8d" stroke-width="6" stroke-linecap="round"/>
  <circle cx="205" cy="181" r="29" fill="none" stroke="#176e9b" stroke-width="6"/>
  <line x1="226" y1="202" x2="250" y2="226" stroke="#176e9b" stroke-width="6"/>
  <text x="24" y="270" class="small">Examples:</text>
  <text x="24" y="296" class="small">header parsing • checksum work</text>
  <text x="24" y="322" class="small">route lookup • device pipeline</text>
  <rect x="24" y="345" width="297" height="28" rx="9" fill="#edf5f7"/>
  <text x="172.5" y="365" text-anchor="middle" class="small">device-dependent</text>
</g>

<g transform="translate(440,365)">
  <rect width="345" height="390" rx="20" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <circle cx="34" cy="38" r="21" fill="#0f8b8d"/><text x="34" y="45" text-anchor="middle" class="head white">2</text>
  <text x="70" y="45" class="head">Queueing</text>
  <text x="24" y="86" class="body">Wait for earlier traffic using the</text>
  <text x="24" y="111" class="body">same output resource.</text>
  <g transform="translate(40,164)">
    <rect width="54" height="42" rx="8" fill="#a9bcc6"/><rect x="64" width="54" height="42" rx="8" fill="#a9bcc6"/>
    <rect x="128" width="54" height="42" rx="8" fill="#a9bcc6"/><rect x="192" width="74" height="42" rx="8" fill="#0f8b8d"/>
  </g>
  <line x1="40" y1="224" x2="306" y2="224" stroke="#69899a" stroke-width="3"/>
  <text x="24" y="270" class="small">Depends on:</text>
  <text x="24" y="296" class="small">offered load • burstiness</text>
  <text x="24" y="322" class="small">scheduler • buffer occupancy</text>
  <rect x="24" y="345" width="297" height="28" rx="9" fill="#fff0e5"/>
  <text x="172.5" y="365" text-anchor="middle" class="small">highly variable</text>
</g>

<g transform="translate(815,365)">
  <rect width="345" height="390" rx="20" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <circle cx="34" cy="38" r="21" fill="#0f8b8d"/><text x="34" y="45" text-anchor="middle" class="head white">3</text>
  <text x="70" y="45" class="head">Transmission</text>
  <text x="24" y="86" class="body">Place all L packet bits onto a</text>
  <text x="24" y="111" class="body">link that emits R bits/s.</text>
  <rect x="48" y="160" width="80" height="50" rx="9" fill="#0f8b8d"/>
  <line x1="128" y1="185" x2="292" y2="185" stroke="#2b6e96" stroke-width="5" marker-end="url(#a)"/>
  <text x="172.5" y="267" text-anchor="middle" class="formula">D<tspan baseline-shift="sub" font-size="18">tx</tspan> = L / R</text>
  <text x="24" y="312" class="small">L = packet length in bits</text>
  <text x="24" y="336" class="small">R = link transmission rate</text>
  <rect x="24" y="345" width="297" height="28" rx="9" fill="#edf5f7"/>
  <text x="172.5" y="365" text-anchor="middle" class="small">packet size + rate</text>
</g>

<g transform="translate(1190,365)">
  <rect width="345" height="390" rx="20" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <circle cx="34" cy="38" r="21" fill="#0f8b8d"/><text x="34" y="45" text-anchor="middle" class="head white">4</text>
  <text x="70" y="45" class="head">Propagation</text>
  <text x="24" y="86" class="body">Move the signal across distance d</text>
  <text x="24" y="111" class="body">through a medium at speed s.</text>
  <line x1="48" y1="185" x2="295" y2="185" stroke="#2b6e96" stroke-width="5" marker-end="url(#a)"/>
  <rect x="135" y="163" width="62" height="44" rx="9" fill="#0f8b8d"/>
  <line x1="48" y1="224" x2="295" y2="224" stroke="#98afb9" stroke-width="2"/>
  <text x="172.5" y="267" text-anchor="middle" class="formula">D<tspan baseline-shift="sub" font-size="18">prop</tspan> = d / s</text>
  <text x="24" y="312" class="small">d = path length</text>
  <text x="24" y="336" class="small">s = signal propagation speed</text>
  <rect x="24" y="345" width="297" height="28" rx="9" fill="#edf5f7"/>
  <text x="172.5" y="365" text-anchor="middle" class="small">distance + medium</text>
</g>

<rect x="80" y="800" width="1440" height="62" rx="16" fill="#e8f5f6"/>
<text x="120" y="827" class="head">At one hop:</text>
<text x="285" y="839" class="formula">D<tspan baseline-shift="sub" font-size="18">hop</tspan> = D<tspan baseline-shift="sub" font-size="18">proc</tspan> + D<tspan baseline-shift="sub" font-size="18">queue</tspan> + D<tspan baseline-shift="sub" font-size="18">tx</tspan> + D<tspan baseline-shift="sub" font-size="18">prop</tspan></text>
<text x="1060" y="827" class="head">End to end:</text>
<text x="1060" y="852" class="body">sum the relevant contributions over every hop.</text>
</svg>