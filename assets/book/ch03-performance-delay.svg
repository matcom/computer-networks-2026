<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Components of end-to-end network delay</title><desc id="desc">A path diagram and four cards explaining processing, queueing, transmission, and propagation delay.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17324a}
.title{font-size:36px;font-weight:750}.subtitle{font-size:18px;fill:#5c7180}.section{font-size:22px;font-weight:720}
.label{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#5c7180}.tiny{font-size:12px;fill:#5c7180}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.white{fill:#fff}.teal{fill:#0f7f82}.blue{fill:#2b6e96}.orange{fill:#c96b1b}
.card{fill:#f8fbfc;stroke:#c6d7df;stroke-width:2}.soft{fill:#edf5f7}.navy{fill:#173a56}.rule{stroke:#8fa9b6;stroke-width:3}.thin{stroke:#9db2bc;stroke-width:2}
</style><rect width="1600" height="900" fill="#fff"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2b6e96"/></marker></defs><text x="64" y="62" class="title">Network delay: decompose before you diagnose</text><text x="64" y="94" class="subtitle">A slow exchange can be limited by device work, waiting in a queue, serialization onto a link, or signal travel time.</text><rect x="64" y="130" width="1472" height="190" rx="18" fill="#f5f9fa" stroke="#c6d7df" stroke-width="2"/><text x="92" y="165" class="section">One packet on one hop</text><rect x="110" y="200" width="190" height="74" rx="18" fill="#fff" stroke="#c6d7df" stroke-width="2"/><text x="205" y="245" class="label" text-anchor="middle">Sender</text><rect x="390" y="214" width="100" height="46" rx="9" fill="#0f7f82"/><text x="440" y="244" class="label white" text-anchor="middle">L bits</text><line x1="300" y1="237" x2="382" y2="237" stroke="#2b6e96" stroke-width="4" marker-end="url(#arr)"/><line x1="490" y1="237" x2="655" y2="237" stroke="#2b6e96" stroke-width="4" marker-end="url(#arr)"/><rect x="660" y="190" width="250" height="95" rx="18" fill="#fff" stroke="#c6d7df" stroke-width="2"/><text x="785" y="224" class="label" text-anchor="middle">Router + output queue</text><rect x="690" y="244" width="32" height="20" rx="4" fill="#aabec7"/><rect x="732" y="244" width="32" height="20" rx="4" fill="#aabec7"/><rect x="774" y="244" width="32" height="20" rx="4" fill="#aabec7"/><rect x="816" y="244" width="32" height="20" rx="4" fill="#0f7f82"/><line x1="910" y1="237" x2="1190" y2="237" stroke="#2b6e96" stroke-width="4" marker-end="url(#arr)"/><rect x="1200" y="200" width="190" height="74" rx="18" fill="#fff" stroke="#c6d7df" stroke-width="2"/><text x="1295" y="245" class="label" text-anchor="middle">Receiver</text><text x="1050" y="214" class="small" text-anchor="middle">link rate R • distance d • signal speed s</text><rect x="64" y="360" width="716" height="190" rx="18" fill="#eaf4f6" stroke="#c6d7df" stroke-width="2"/><circle cx="102" cy="398" r="21" fill="#0f7f82"/><text x="102" y="405" class="label white" text-anchor="middle">1</text><text x="140" y="404" class="section">Processing delay</text><text x="92" y="445" class="body">Device inspects the packet and decides what to do.</text><text x="92" y="484" class="label">Changes with:</text><text x="254" y="484" class="small">header parsing • lookup • checksum • pipeline</text><rect x="92" y="505" width="660" height="30" rx="8" fill="#fff" stroke="#d7e2e6"/><text x="422" y="526" class="label" text-anchor="middle">No simple universal formula</text><rect x="820" y="360" width="716" height="190" rx="18" fill="#fff3e8" stroke="#c6d7df" stroke-width="2"/><circle cx="858" cy="398" r="21" fill="#0f7f82"/><text x="858" y="405" class="label white" text-anchor="middle">2</text><text x="896" y="404" class="section">Queueing delay</text><text x="848" y="445" class="body">Packet waits behind earlier traffic for the same output.</text><text x="848" y="484" class="label">Changes with:</text><text x="1010" y="484" class="small">offered load • burstiness • scheduler • buffer</text><rect x="848" y="505" width="660" height="30" rx="8" fill="#fff" stroke="#d7e2e6"/><text x="1178" y="526" class="label" text-anchor="middle">Variable: near 0 → very large</text><rect x="64" y="585" width="716" height="190" rx="18" fill="#eaf4f6" stroke="#c6d7df" stroke-width="2"/><circle cx="102" cy="623" r="21" fill="#0f7f82"/><text x="102" y="630" class="label white" text-anchor="middle">3</text><text x="140" y="629" class="section">Transmission delay</text><text x="92" y="670" class="body">Time to place all L packet bits onto a link of rate R.</text><text x="92" y="709" class="label">Changes with:</text><text x="254" y="709" class="small">packet size L • link rate R</text><rect x="92" y="730" width="660" height="30" rx="8" fill="#fff" stroke="#d7e2e6"/><text x="422" y="751" class="label" text-anchor="middle">D_tx = L / R</text><rect x="820" y="585" width="716" height="190" rx="18" fill="#eaf4f6" stroke="#c6d7df" stroke-width="2"/><circle cx="858" cy="623" r="21" fill="#0f7f82"/><text x="858" y="630" class="label white" text-anchor="middle">4</text><text x="896" y="629" class="section">Propagation delay</text><text x="848" y="670" class="body">Time for the signal to travel physical distance d at speed s.</text><text x="848" y="709" class="label">Changes with:</text><text x="1010" y="709" class="small">distance d • medium propagation speed s</text><rect x="848" y="730" width="660" height="30" rx="8" fill="#fff" stroke="#d7e2e6"/><text x="1178" y="751" class="label" text-anchor="middle">D_prop = d / s</text><rect x="64" y="812" width="1472" height="54" rx="14" fill="#e6f4f4" stroke="#b5d9d8" stroke-width="2"/><text x="800" y="846" class="body" text-anchor="middle">Per hop: D_hop = D_proc + D_queue + D_tx + D_prop     •     End to end: sum the relevant contributions across the path.</text></svg>