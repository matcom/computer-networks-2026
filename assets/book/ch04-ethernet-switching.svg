  <g fill="#102a3a" font-size="30" font-weight="700"><text x="215" y="218">A</text><text x="985" y="218">B</text><text x="215" y="503">C</text><text x="985" y="503">D</text></g>
  <g><rect x="500" y="92" width="200" height="125" rx="18" fill="#f8fbfc" stroke="#d9e0e4"/><text x="600" y="126" font-size="19" fill="#60717f">MAC</text><text x="600" y="158" font-size="20" font-weight="700" fill="#102a3a">A → 1</text><text x="600" y="190" font-size="20" font-weight="700" fill="#102a3a">B → 2</text></g>
