<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 920" role="img" aria-labelledby="title desc">
<title id="title">Ethernet learning switch forwarding trace</title>
<desc id="desc">Two aligned panels show how an Ethernet switch learns source MAC addresses and then forwards. First A sends to unknown D, so the switch learns A on port 1 and floods out ports 2, 3, and 4. Then D replies, the switch learns D on port 4, finds A on port 1, and unicasts only to port 1.</desc>
<style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#183247}
  .title{font-size:34px;font-weight:760}.subtitle{font-size:18px;fill:#587181}
  .head{font-size:20px;font-weight:760}.body{font-size:16px}.small{font-size:14px;fill:#587181}
  .mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}.white{fill:#fff}
</style>
<rect width="1600" height="920" fill="#fff"/>
<text x="80" y="64" class="title">A learning switch learns from sources and forwards by destination</text>
<text x="80" y="98" class="subtitle">The two decisions are separate: learn the ingress location of the source MAC, then look up the destination MAC.</text>
<defs>
  <marker id="teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#0f8b8d"/></marker>
  <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#d97824"/></marker>
</defs>

<!-- common topology -->
<rect x="80" y="135" width="1440" height="235" rx="22" fill="#f7fafb" stroke="#d0dee4"/>
<g transform="translate(125,182)">
  <rect width="170" height="105" rx="16" fill="#edf4f6" stroke="#9fb9c5" stroke-width="2"/>
  <rect x="26" y="18" width="118" height="60" rx="7" fill="#bdd9e5" stroke="#365b72" stroke-width="3"/>
  <text x="85" y="56" text-anchor="middle" class="head">A</text>
  <text x="85" y="128" text-anchor="middle" class="mono">AA:AA:…</text>
</g>
<g transform="translate(365,182)">
  <rect width="170" height="105" rx="16" fill="#edf4f6" stroke="#9fb9c5" stroke-width="2"/>
  <rect x="26" y="18" width="118" height="60" rx="7" fill="#bdd9e5" stroke="#365b72" stroke-width="3"/>
  <text x="85" y="56" text-anchor="middle" class="head">B</text>
  <text x="85" y="128" text-anchor="middle" class="mono">BB:BB:…</text>
</g>
<g transform="translate(1265,182)">
  <rect width="170" height="105" rx="16" fill="#edf4f6" stroke="#9fb9c5" stroke-width="2"/>
  <rect x="26" y="18" width="118" height="60" rx="7" fill="#bdd9e5" stroke="#365b72" stroke-width="3"/>
  <text x="85" y="56" text-anchor="middle" class="head">D</text>
  <text x="85" y="128" text-anchor="middle" class="mono">DD:DD:…</text>
</g>
<g transform="translate(1025,182)">
  <rect width="170" height="105" rx="16" fill="#edf4f6" stroke="#9fb9c5" stroke-width="2"/>
  <rect x="26" y="18" width="118" height="60" rx="7" fill="#bdd9e5" stroke="#365b72" stroke-width="3"/>
  <text x="85" y="56" text-anchor="middle" class="head">C</text>
  <text x="85" y="128" text-anchor="middle" class="mono">CC:CC:…</text>
</g>
<g transform="translate(650,185)">
  <rect width="300" height="120" rx="20" fill="#173a56"/>
  <text x="150" y="32" text-anchor="middle" class="head white">Learning switch</text>
  <g fill="#d8eef2"><rect x="34" y="55" width="44" height="30" rx="4"/><rect x="96" y="55" width="44" height="30" rx="4"/><rect x="160" y="55" width="44" height="30" rx="4"/><rect x="222" y="55" width="44" height="30" rx="4"/></g>
  <text x="56" y="105" text-anchor="middle" class="small white">1</text><text x="118" y="105" text-anchor="middle" class="small white">2</text><text x="182" y="105" text-anchor="middle" class="small white">3</text><text x="244" y="105" text-anchor="middle" class="small white">4</text>
</g>
<path d="M295 235H650M535 235H620V270H650M950 235h75M1195 235h70" fill="none" stroke="#789aaa" stroke-width="5"/>
<text x="470" y="220" text-anchor="middle" class="small">port 1</text>
<text x="585" y="298" text-anchor="middle" class="small">port 2</text>
<text x="990" y="220" text-anchor="middle" class="small">port 3</text>
<text x="1230" y="220" text-anchor="middle" class="small">port 4</text>

<!-- step 1 -->
<g transform="translate(80,415)">
  <rect width="700" height="370" rx="22" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <circle cx="36" cy="40" r="22" fill="#0f8b8d"/><text x="36" y="47" text-anchor="middle" class="head white">1</text>
  <text x="76" y="47" class="head">A sends to D; D is unknown</text>
  <text x="28" y="88" class="body">Frame arrives on port 1 with source A and destination D.</text>

  <rect x="28" y="120" width="250" height="75" rx="13" fill="#e8f5f6"/>
  <text x="153" y="149" text-anchor="middle" class="head">Learn source</text>
  <text x="153" y="177" text-anchor="middle" class="mono">A → port 1</text>

  <line x1="298" y1="157" x2="382" y2="157" stroke="#0f8b8d" stroke-width="5" marker-end="url(#teal)"/>

  <rect x="402" y="120" width="270" height="75" rx="13" fill="#fff0e5"/>
  <text x="537" y="149" text-anchor="middle" class="head">Lookup destination D</text>
  <text x="537" y="177" text-anchor="middle" class="body">no table entry → flood</text>

  <g transform="translate(50,235)">
    <rect width="100" height="54" rx="10" fill="#0f8b8d"/><text x="50" y="34" text-anchor="middle" class="head white">A → D</text>
    <line x1="100" y1="27" x2="260" y2="27" stroke="#d97824" stroke-width="5" marker-end="url(#orange)"/>
    <line x1="270" y1="27" x2="390" y2="-25" stroke="#d97824" stroke-width="4" marker-end="url(#orange)"/>
    <line x1="270" y1="27" x2="390" y2="27" stroke="#d97824" stroke-width="4" marker-end="url(#orange)"/>
    <line x1="270" y1="27" x2="390" y2="79" stroke="#d97824" stroke-width="4" marker-end="url(#orange)"/>
    <text x="420" y="-18" class="body">port 2 → B ignores</text>
    <text x="420" y="34" class="body">port 3 → C ignores</text>
    <text x="420" y="86" class="body">port 4 → D accepts</text>
  </g>
</g>

<!-- step 2 -->
<g transform="translate(820,415)">
  <rect width="700" height="370" rx="22" fill="#fafcfd" stroke="#cbdbe2" stroke-width="2"/>
  <circle cx="36" cy="40" r="22" fill="#0f8b8d"/><text x="36" y="47" text-anchor="middle" class="head white">2</text>
  <text x="76" y="47" class="head">D replies to A; A is known</text>
  <text x="28" y="88" class="body">Frame arrives on port 4 with source D and destination A.</text>

  <rect x="28" y="120" width="220" height="75" rx="13" fill="#e8f5f6"/>
  <text x="138" y="149" text-anchor="middle" class="head">Learn source</text>
  <text x="138" y="177" text-anchor="middle" class="mono">D → port 4</text>

  <line x1="268" y1="157" x2="350" y2="157" stroke="#0f8b8d" stroke-width="5" marker-end="url(#teal)"/>

  <rect x="370" y="120" width="220" height="75" rx="13" fill="#e8f5f6"/>
  <text x="480" y="149" text-anchor="middle" class="head">Lookup A</text>
  <text x="480" y="177" text-anchor="middle" class="mono">A → port 1</text>

  <line x1="610" y1="157" x2="662" y2="157" stroke="#0f8b8d" stroke-width="5" marker-end="url(#teal)"/>

  <rect x="28" y="235" width="644" height="90" rx="13" fill="#f0f5f7"/>
  <text x="48" y="264" class="head">MAC table after the exchange</text>
  <text x="48" y="298" class="mono">A → port 1</text>
  <text x="210" y="298" class="mono">D → port 4</text>
  <text x="382" y="298" class="small">B and C remain unknown until they transmit.</text>
</g>

<rect x="80" y="825" width="1440" height="52" rx="15" fill="#e8f5f6"/>
<text x="800" y="858" text-anchor="middle" class="body"><tspan font-weight="750">Switch rule:</tspan> learn source MAC → ingress port; then forward known destinations, flood unknown destinations, and never send back to ingress.</text>
</svg>