<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Ethernet learning switch forwarding trace</title><desc id="desc">Four hosts attach to a switch. The switch learns source addresses and either floods an unknown destination or forwards a known destination on one port.</desc>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17324a}
.title{font-size:36px;font-weight:750}.subtitle{font-size:18px;fill:#5c7180}.section{font-size:22px;font-weight:720}
.label{font-size:18px;font-weight:700}.body{font-size:15px}.small{font-size:13px;fill:#5c7180}.tiny{font-size:12px;fill:#5c7180}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.white{fill:#fff}.teal{fill:#0f7f82}.blue{fill:#2b6e96}.orange{fill:#c96b1b}
.card{fill:#f8fbfc;stroke:#c6d7df;stroke-width:2}.soft{fill:#edf5f7}.navy{fill:#173a56}.rule{stroke:#8fa9b6;stroke-width:3}.thin{stroke:#9db2bc;stroke-width:2}
</style><rect width="1600" height="1000" fill="#fff"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f7f82"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c96b1b"/></marker></defs><text x="64" y="62" class="title">Ethernet learning: learn the source, then look up the destination</text><text x="64" y="94" class="subtitle">Unknown destinations are flooded; known destinations are forwarded only to the learned egress port.</text><rect x="64" y="130" width="1472" height="330" rx="18" fill="#f5f9fa" stroke="#c6d7df" stroke-width="2"/><text x="92" y="166" class="section">Four-host switched LAN</text><rect x="600" y="230" width="240" height="120" rx="18" fill="#173a56"/><text x="720" y="265" class="label white" text-anchor="middle">Learning switch</text><rect x="630" y="292" width="36" height="26" rx="4" fill="#d8eef2"/><text x="648" y="338" class="small white" text-anchor="middle">1</text><rect x="682" y="292" width="36" height="26" rx="4" fill="#d8eef2"/><text x="700" y="338" class="small white" text-anchor="middle">2</text><rect x="734" y="292" width="36" height="26" rx="4" fill="#d8eef2"/><text x="752" y="338" class="small white" text-anchor="middle">3</text><rect x="786" y="292" width="36" height="26" rx="4" fill="#d8eef2"/><text x="804" y="338" class="small white" text-anchor="middle">4</text><rect x="120" y="190" width="180" height="90" rx="18" fill="#fff" stroke="#c6d7df" stroke-width="2"/><text x="210" y="224" class="label" text-anchor="middle">Host A</text><text x="210" y="253" class="mono" text-anchor="middle">AA:AA:…</text><rect x="120" y="325" width="180" height="90" rx="18" fill="#fff" stroke="#c6d7df" stroke-width="2"/><text x="210" y="359" class="label" text-anchor="middle">Host B</text><text x="210" y="388" class="mono" text-anchor="middle">BB:BB:…</text><rect x="930" y="190" width="180" height="90" rx="18" fill="#fff" stroke="#c6d7df" stroke-width="2"/><text x="1020" y="224" class="label" text-anchor="middle">Host C</text><text x="1020" y="253" class="mono" text-anchor="middle">CC:CC:…</text><rect x="930" y="325" width="180" height="90" rx="18" fill="#fff" stroke="#c6d7df" stroke-width="2"/><text x="1020" y="359" class="label" text-anchor="middle">Host D</text><text x="1020" y="388" class="mono" text-anchor="middle">DD:DD:…</text><path d="M300 235H470V292H630" fill="none" stroke="#6f8fa0" stroke-width="4"/><path d="M300 370H500V292H682" fill="none" stroke="#6f8fa0" stroke-width="4"/><path d="M840 292H875V235H930" fill="none" stroke="#6f8fa0" stroke-width="4"/><path d="M786 292H865V370H930" fill="none" stroke="#6f8fa0" stroke-width="4"/><rect x="1160" y="185" width="300" height="220" rx="18" fill="#fff" stroke="#c6d7df" stroke-width="2"/><text x="1310" y="220" class="label" text-anchor="middle">MAC table after A↔D</text><text x="1200" y="258" class="small">Address</text><text x="1370" y="258" class="small">Port</text><line x1="1190" y1="270" x2="1430" y2="270" stroke="#c6d7df"/><text x="1200" y="308" class="mono">A</text><text x="1375" y="308" class="mono">1</text><text x="1200" y="350" class="mono">D</text><text x="1375" y="350" class="mono">4</text><text x="1310" y="387" class="tiny" text-anchor="middle">B and C are still unknown</text><rect x="64" y="505" width="716" height="390" rx="18" fill="#fbfcfd" stroke="#c6d7df" stroke-width="2"/><text x="92" y="545" class="section">1  A → D: D is unknown</text><text x="92" y="582" class="label">Ingress on port 1</text><text x="92" y="615" class="body">Learn source: A → port 1</text><text x="92" y="648" class="body">Lookup destination D: no entry</text><rect x="92" y="676" width="626" height="62" rx="12" fill="#fff3e8" stroke="#ead0b9"/><text x="405" y="703" class="label" text-anchor="middle">Flood the frame out every port except port 1</text><text x="405" y="727" class="small" text-anchor="middle">B and C ignore it; D accepts it because the destination MAC matches D.</text><path d="M112 790H235" stroke="#c96b1b" stroke-width="5" marker-end="url(#arr2)"/><path d="M245 790H370" stroke="#c96b1b" stroke-width="5" marker-end="url(#arr2)"/><path d="M380 790H505" stroke="#c96b1b" stroke-width="5" marker-end="url(#arr2)"/><text x="112" y="825" class="small">2</text><text x="245" y="825" class="small">3</text><text x="380" y="825" class="small">4</text><rect x="820" y="505" width="716" height="390" rx="18" fill="#fbfcfd" stroke="#c6d7df" stroke-width="2"/><text x="848" y="545" class="section">2  D → A: A is known</text><text x="848" y="582" class="label">Ingress on port 4</text><text x="848" y="615" class="body">Learn source: D → port 4</text><text x="848" y="648" class="body">Lookup destination A: table says port 1</text><rect x="848" y="676" width="626" height="62" rx="12" fill="#e8f4f4" stroke="#b9d9d7"/><text x="1161" y="703" class="label" text-anchor="middle">Forward only on port 1</text><text x="1161" y="727" class="small" text-anchor="middle">The switch does not send the reply to B or C.</text><path d="M860 790H1120" stroke="#0f7f82" stroke-width="5" marker-end="url(#arr)"/><text x="990" y="825" class="small" text-anchor="middle">egress port 1</text><rect x="64" y="925" width="1472" height="44" rx="12" fill="#e6f4f4" stroke="#b5d9d8" stroke-width="2"/><text x="800" y="954" class="body" text-anchor="middle">Core rule: learn SOURCE MAC → ingress port; then lookup DESTINATION MAC → forward one port, flood unknown, or filter if destination is on ingress.</text></svg>