</style><rect width="1600" height="1000" fill="#fff"/><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0f7f82"/></marker><marker id="arr2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c96b1b"/></marker></defs><text x="64" y="62" class="title">Internet architecture: one request, several forwarding domains</text><text x="64" y="94" class="subtitle">Endpoints create application and transport state; switches forward local frames; routers forward IP packets between networks.</text><line x1="130" y1="135" x2="1470" y2="135" stroke="#0f7f82" stroke-width="4" marker-end="url(#arr)"/><text x="800" y="126" class="label teal" text-anchor="middle">HTTP request →</text><line x1="1470" y1="170" x2="130" y2="170" stroke="#c96b1b" stroke-width="3" marker-end="url(#arr2)"/><text x="800" y="194" class="body orange" text-anchor="middle">← HTTP response</text><rect x="60" y="225" width="196" height="150" rx="18" fill="#f6fafb" stroke="#c6d7df" stroke-width="2"/><text x="158.0" y="259" class="label" text-anchor="middle">Client</text><rect x="118" y="275" width="80" height="52" rx="8" fill="#dcebf0" stroke="#6f8fa0" stroke-width="2"/><text x="158.0" y="353" class="small" text-anchor="middle">Browser</text><line x1="256" y1="300" x2="272" y2="300" stroke="#789aaa" stroke-width="3" marker-end="url(#arr)"/><rect x="274" y="225" width="196" height="150" rx="18" fill="#f6fafb" stroke="#c6d7df" stroke-width="2"/><text x="372.0" y="259" class="label" text-anchor="middle">LAN A</text><path d="M322 307c28-42 74-42 100 0M343 320c18-25 42-25 60 0" fill="none" stroke="#2b6e96" stroke-width="6" stroke-linecap="round"/><text x="372.0" y="353" class="small" text-anchor="middle">Ethernet / Wi‑Fi</text><line x1="470" y1="300" x2="486" y2="300" stroke="#789aaa" stroke-width="3" marker-end="url(#arr)"/><rect x="488" y="225" width="196" height="150" rx="18" fill="#f6fafb" stroke="