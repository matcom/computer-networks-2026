<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
<title id="title">Internet architecture and protocol layers</title>
<desc id="desc">A client browser sends an HTTP request through a local LAN, switch, gateway router, the routed Internet, a destination router and LAN to a web server. The lower half shows which protocol layers are present at endpoints, switches, and routers.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#17324a}.h{font-size:29px;font-weight:780}.m{font-size:19px;font-weight:700}.b{font-size:17px}.s{font-size:14px;fill:#5d7280}.w{fill:#fff}.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:14px}
</style>
<rect width="1600" height="980" fill="#fff"/>
<text x="70" y="65" class="h">One application exchange crosses several systems</text>
<text x="70" y="98" class="b">Endpoints create application and transport state; switches forward local frames; routers forward IP packets between networks.</text>

<!-- request / response -->
<defs><marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#0f8b8d"/></marker><marker id="arr2" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#d97824"/></marker></defs>
<line x1="145" y1="140" x2="1455" y2="140" stroke="#0f8b8d" stroke-width="5" marker-end="url(#arr)"/>
<text x="800" y="128" text-anchor="middle" class="m" fill="#0f8b8d">HTTP request: GET /</text>
<line x1="1455" y1="175" x2="145" y2="175" stroke="#d97824" stroke-width="4" stroke-dasharray="14 10" marker-end="url(#arr2)"/>
<text x="800" y="204" text-anchor="middle" class="b" fill="#b85d16">HTTP response: status + content</text>

<!-- path -->
<line x1="175" y1="330" x2="1420" y2="330" stroke="#789aaa" stroke-width="7" stroke-linecap="round"/>
<g transform="translate(60,245)">
 <rect width="190" height="145" rx="18" fill="#eef5f7" stroke="#9ab8c5" stroke-width="3"/>
 <rect x="30" y="23" width="130" height="75" rx="8" fill="#bed9e5" stroke="#345b73" stroke-width="4"/>
 <rect x="56" y="40" width="78" height="42" rx="4" fill="#fff"/>
 <text x="95" y="66" text-anchor="middle" class="s">browser</text>
 <path d="M58 106h74l20 18H38z" fill="#456d84"/>
 <text x="95" y="-18" text-anchor="middle" class="m">Client</text>
</g>
<g transform="translate(300,262)">
 <rect width="170" height="120" rx="18" fill="#edf4f7" stroke="#b5cbd4" stroke-width="2"/>
 <path d="M45 73c25-50 65-50 80 0" fill="none" stroke="#2781b6" stroke-width="8" stroke-linecap="round"/>
 <path d="M60 73c18-28 42-28 52 0" fill="none" stroke="#2781b6" stroke-width="8" stroke-linecap="round"/>
 <circle cx="86" cy="76" r="7" fill="#2781b6"/>
 <text x="85" y="106" text-anchor="middle" class="m">LAN A</text>
 <text x="85" y="-14" text-anchor="middle" class="s">Ethernet / Wi-Fi</text>
</g>
<g transform="translate(505,275)">
 <rect width="160" height="86" rx="15" fill="#153a56"/>
 <g fill="#d8eef2"><rect x="20" y="30" width="24" height="20" rx="3"/><rect x="52" y="30" width="24" height="20" rx="3"/><rect x="84" y="30" width="24" height="20" rx="3"/><rect x="116" y="30" width="24" height="20" rx="3"/></g>
 <text x="80" y="-17" text-anchor="middle" class="m">Switch</text>
 <text x="80" y="107" text-anchor="middle" class="s">forwards frames by MAC</text>
</g>
<g transform="translate(710,268)">
 <ellipse cx="78" cy="45" rx="78" ry="45" fill="#176e9b"/>
 <path d="M34 45h88M78 13v64M50 28L34 45l16 17M106 28l16 17-16 17" fill="none" stroke="#fff" stroke-width="6"/>
 <text x="78" y="-18" text-anchor="middle" class="m">Gateway</text>
 <text x="78" y="108" text-anchor="middle" class="s">IP next hop</text>
</g>
<g transform="translate(900,253)">
 <path d="M30 115c-28-8-30-50 4-62 6-33 48-47 73-23 25-28 74-8 73 29 38 4 43 49 10 57z" fill="#e7f1f5" stroke="#7f9ead" stroke-width="4"/>
 <text x="104" y="82" text-anchor="middle" class="h" font-size="25">Internet</text>
 <text x="104" y="-10" text-anchor="middle" class="m">Routed networks</text>
</g>
<g transform="translate(1140,268)">
 <ellipse cx="78" cy="45" rx="78" ry="45" fill="#176e9b"/>
 <path d="M34 45h88M78 13v64M50 28L34 45l16 17M106 28l16 17-16 17" fill="none" stroke="#fff" stroke-width="6"/>
 <text x="78" y="-18" text-anchor="middle" class="m">Router</text>
 <text x="78" y="108" text-anchor="middle" class="s">forwards IP packets</text>
</g>
<g transform="translate(1330,262)">
 <rect width="120" height="120" rx="18" fill="#edf4f7" stroke="#b5cbd4" stroke-width="2"/>
 <circle cx="60" cy="45" r="24" fill="#2781b6"/>
 <path d="M60 69v25M35 94h50" stroke="#2781b6" stroke-width="6" stroke-linecap="round"/>
 <text x="60" y="112" text-anchor="middle" class="s">LAN B</text>
</g>
<g transform="translate(1460,245)">
 <rect x="-20" width="105" height="145" rx="15" fill="#153a56"/>
 <g fill="#78c9bd"><circle cx="55" cy="35" r="6"/><circle cx="55" cy="67" r="6"/><circle cx="55" cy="99" r="6"/></g>
 <g stroke="#87a8b7"><line x1="0" y1="35" x2="42" y2="35"/><line x1="0" y1="67" x2="42" y2="67"/><line x1="0" y1="99" x2="42" y2="99"/></g>
 <text x="32" y="-18" text-anchor="middle" class="m">Web server</text>
</g>

<!-- layers explanation -->
<text x="70" y="470" class="h">Layer responsibility changes along the path</text>
<text x="70" y="500" class="s">A device only needs the layers required for its job on this exchange.</text>
<g transform="translate(85,535)">
 <text x="0" y="38" class="m">Application</text><text x="0" y="113" class="m">Transport</text><text x="0" y="188" class="m">Network</text><text x="0" y="263" class="m">Link</text><text x="0" y="338" class="m">Physical</text>
</g>
<g transform="translate(260,530)">
 <text x="110" y="-12" text-anchor="middle" class="m">Client endpoint</text>
 <rect x="0" y="0" width="220" height="55" rx="10" fill="#173a56"/><text x="110" y="34" text-anchor="middle" class="m w">HTTP</text>
 <rect x="0" y="75" width="220" height="55" rx="10" fill="#0f8b8d"/><text x="110" y="109" text-anchor="middle" class="m w">TCP</text>
 <rect x="0" y="150" width="220" height="55" rx="10" fill="#537d99"/><text x="110" y="184" text-anchor="middle" class="m w">IP</text>
 <rect x="0" y="225" width="220" height="55" rx="10" fill="#cfe2ec"/><text x="110" y="259" text-anchor="middle" class="m">Ethernet / Wi-Fi</text>
 <rect x="0" y="300" width="220" height="55" rx="10" fill="#e8eff2"/><text x="110" y="334" text-anchor="middle" class="m">bits / signals</text>
</g>
<g transform="translate(520,530)">
 <text x="110" y="-12" text-anchor="middle" class="m">Switch</text>
 <rect x="0" y="225" width="220" height="55" rx="10" fill="#cfe2ec"/><text x="110" y="259" text-anchor="middle" class="m">Ethernet frame</text>
 <rect x="0" y="300" width="220" height="55" rx="10" fill="#e8eff2"/><text x="110" y="334" text-anchor="middle" class="m">bits / signals</text>
 <text x="110" y="410" text-anchor="middle" class="s">No HTTP/TCP/IP decision is needed</text>
 <text x="110" y="432" text-anchor="middle" class="s">for ordinary layer-2 forwarding.</text>
</g>
<g transform="translate(780,530)">
 <text x="110" y="-12" text-anchor="middle" class="m">Router</text>
 <rect x="0" y="150" width="220" height="55" rx="10" fill="#537d99"/><text x="110" y="184" text-anchor="middle" class="m w">IP packet</text>
 <rect x="0" y="225" width="220" height="55" rx="10" fill="#cfe2ec"/><text x="110" y="259" text-anchor="middle" class="m">link frame</text>
 <rect x="0" y="300" width="220" height="55" rx="10" fill="#e8eff2"/><text x="110" y="334" text-anchor="middle" class="m">bits / signals</text>
 <text x="110" y="410" text-anchor="middle" class="s">The IP destination remains the server;</text>
 <text x="110" y="432" text-anchor="middle" class="s">the link next hop changes each hop.</text>
</g>
<g transform="translate(1040,530)">
 <text x="110" y="-12" text-anchor="middle" class="m">Internet core</text>
 <rect x="0" y="150" width="220" height="55" rx="10" fill="#537d99"/><text x="110" y="184" text-anchor="middle" class="m w">IP packet</text>
 <rect x="0" y="225" width="220" height="55" rx="10" fill="#cfe2ec"/><text x="110" y="259" text-anchor="middle" class="m">many link types</text>
 <rect x="0" y="300" width="220" height="55" rx="10" fill="#e8eff2"/><text x="110" y="334" text-anchor="middle" class="m">signals on each link</text>
</g>
<g transform="translate(1300,530)">
 <text x="110" y="-12" text-anchor="middle" class="m">Server endpoint</text>
 <rect x="0" y="0" width="220" height="55" rx="10" fill="#173a56"/><text x="110" y="34" text-anchor="middle" class="m w">HTTP</text>
 <rect x="0" y="75" width="220" height="55" rx="10" fill="#0f8b8d"/><text x="110" y="109" text-anchor="middle" class="m w">TCP</text>
 <rect x="0" y="150" width="220" height="55" rx="10" fill="#537d99"/><text x="110" y="184" text-anchor="middle" class="m w">IP</text>
 <rect x="0" y="225" width="220" height="55" rx="10" fill="#cfe2ec"/><text x="110" y="259" text-anchor="middle" class="m">Ethernet / Wi-Fi</text>
 <rect x="0" y="300" width="220" height="55" rx="10" fill="#e8eff2"/><text x="110" y="334" text-anchor="middle" class="m">bits / signals</text>
</g>
<rect x="80" y="920" width="1440" height="38" rx="12" fill="#e8f5f6"/>
<text x="800" y="945" text-anchor="middle" class="b"><tspan font-weight="760">Encapsulation:</tspan> HTTP data → TCP segment → IP packet → local frame → physical signal; the receiver reverses the process.</text>
</svg>