<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Internet architecture and protocol layers</title><desc id="desc">A client-to-server path and a matrix showing which protocol layers each device uses.</desc>
