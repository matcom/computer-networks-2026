<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 940" role="img" aria-labelledby="title desc">
<title id="title">Internet architecture and protocol layers</title>
<desc id="desc">A client sends an HTTP request through a local LAN, switch, gateway router, Internet core, destination router, and server. A lower table shows which protocol layers each type of device uses for its forwarding job.</desc>
<style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#183247}
  .title{font-size:34px;font-weight:760}.subtitle{font-size:18px;fill:#587181}
  .head{font-size:20px;font-weight:750}.body{font-size:16px}.small{font-size:14px;fill:#587181}
  .cell{font-size:16px;font-weight:700}.white{fill:#fff}
</style>
<rect width="1600" height="940" fill="#fff"/>
<text x="80" y="64" class="title">One web request crosses several kinds of network devices</text>
<text x="80" y="98" class="subtitle">Endpoints run application and transport protocols; switches forward local frames; routers forward IP packets between networks.</text>

<defs>
  <marker id="teal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#0f8b8d"/></marker>
  <marker id="orange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#d97824"/></marker>
</defs>

<!-- directional exchange -->
<line x1="150" y1="145" x2="1450" y2="145" stroke="#0f8b8d" stroke-width="5" marker-end="url(#teal)"/>
<text x="800" y="132" text-anchor="middle" class="head" fill="#0f8b8d">HTTP request →</text>
<line x1="1450" y1="180" x2="150" y2="180" stroke="#d97824" stroke-width="4" stroke-dasharray="12 10" marker-end="url(#orange)"/>
<text x="800" y="207" text-anchor="middle" class="body" fill="#b85d16">← HTTP response</text>

<!-- device path on an exact grid -->
<line x1="175" y1="350" x2="1425" y2="350" stroke="#7ea1b2" stroke-width="6" stroke-linecap="round"/>
<g transform="translate(80,260)">
  <rect width="190" height="145" rx="18" fill="#edf4f6" stroke="#9fb9c5" stroke-width="2"/>
  <rect x="30" y="22" width="130" height="74" rx="8" fill="#bdd9e5" stroke="#365b72" stroke-width="3"/>
  <rect x="55" y="40" width="80" height="40" rx="4" fill="#fff"/>
  <text x="95" y="65" text-anchor="middle" class="small">browser</text>
  <path d="M60 105h70l18 15H42z" fill="#456d84"/>
  <text x="95" y="-16" text-anchor="middle" class="head">Client</text>
</g>
<g transform="translate(310,285)">
  <rect width="170" height="105" rx="18" fill="#f3f7f9" stroke="#c6d7df" stroke-width="2"/>
  <path d="M38 68c24-38 70-38 94 0M58 74c14-20 40-20 54 0" fill="none" stroke="#2781b6" stroke-width="7" stroke-linecap="round"/>
  <circle cx="85" cy="82" r="6" fill="#2781b6"/>
  <text x="85" y="-16" text-anchor="middle" class="head">LAN A</text>
  <text x="85" y="126" text-anchor="middle" class="small">Ethernet / Wi-Fi</text>
</g>
<g transform="translate(535,296)">
  <rect width="170" height="82" rx="15" fill="#173a56"/>
  <g fill="#d8eef2"><rect x="22" y="29" width="24" height="20" rx="3"/><rect x="56" y="29" width="24" height="20" rx="3"/><rect x="90" y="29" width="24" height="20" rx="3"/><rect x="124" y="29" width="24" height="20" rx="3"/></g>
  <text x="85" y="-16" text-anchor="middle" class="head">Switch</text>
  <text x="85" y="106" text-anchor="middle" class="small">MAC forwarding</text>
</g>
<g transform="translate(765,292)">
  <ellipse cx="78" cy="40" rx="78" ry="40" fill="#176e9b"/>
  <path d="M36 40h84M78 12v56M50 26 36 40l14 14M106 26l14 14-14 14" fill="none" stroke="#fff" stroke-width="6"/>
  <text x="78" y="-16" text-anchor="middle" class="head">Gateway</text>
  <text x="78" y="102" text-anchor="middle" class="small">IP next hop</text>
</g>
<g transform="translate(970,278)">
  <path d="M25 98c-25-8-26-42 4-52 5-28 40-39 62-20 21-23 61-7 61 25 32 4 36 41 8 47z" fill="#e7f1f5" stroke="#7f9ead" stroke-width="3"/>
  <text x="90" y="68" text-anchor="middle" class="head">Internet</text>
  <text x="90" y="-12" text-anchor="middle" class="head">Routed core</text>
  <text x="90" y="122" text-anchor="middle" class="small">many independent links</text>
</g>
<g transform="translate(1190,292)">
  <ellipse cx="78" cy="40" rx="78" ry="40" fill="#176e9b"/>
  <path d="M36 40h84M78 12v56M50 26 36 40l14 14M106 26l14 14-14 14" fill="none" stroke="#fff" stroke-width="6"/>
  <text x="78" y="-16" text-anchor="middle" class="head">Router</text>
  <text x="78" y="102" text-anchor="middle" class="small">IP forwarding</text>
</g>
<g transform="translate(1370,260)">
  <rect width="145" height="145" rx="16" fill="#173a56"/>
  <g stroke="#87a8b7" stroke-width="3"><line x1="25" y1="43" x2="105" y2="43"/><line x1="25" y1="76" x2="105" y2="76"/><line x1="25" y1="109" x2="105" y2="109"/></g>
  <g fill="#78c9bd"><circle cx="120" cy="43" r="6"/><circle cx="120" cy="76" r="6"/><circle cx="120" cy="109" r="6"/></g>
  <text x="72" y="-16" text-anchor="middle" class="head">Server</text>
</g>

<!-- layer matrix -->
<text x="80" y="500" class="title">Which layers matter at each device?</text>
<text x="80" y="532" class="subtitle">The same data is encapsulated differently as it moves, but each device only needs the layers required for its job.</text>

<g transform="translate(80,575)">
  <!-- table frame -->
  <rect width="1440" height="280" rx="16" fill="#fff" stroke="#c9d9df" stroke-width="2"/>
  <!-- verticals -->
  <line x1="210" y1="0" x2="210" y2="280" stroke="#c9d9df"/>
  <line x1="456" y1="0" x2="456" y2="280" stroke="#c9d9df"/>
  <line x1="702" y1="0" x2="702" y2="280" stroke="#c9d9df"/>
  <line x1="948" y1="0" x2="948" y2="280" stroke="#c9d9df"/>
  <line x1="1194" y1="0" x2="1194" y2="280" stroke="#c9d9df"/>
  <!-- horizontals -->
  <line x1="0" y1="55" x2="1440" y2="55" stroke="#c9d9df"/>
  <line x1="0" y1="100" x2="1440" y2="100" stroke="#e0e9ed"/>
  <line x1="0" y1="145" x2="1440" y2="145" stroke="#e0e9ed"/>
  <line x1="0" y1="190" x2="1440" y2="190" stroke="#e0e9ed"/>
  <line x1="0" y1="235" x2="1440" y2="235" stroke="#e0e9ed"/>

  <rect x="0" y="0" width="1440" height="55" rx="16" fill="#f2f7f8"/>
  <text x="105" y="35" text-anchor="middle" class="head">Layer</text>
  <text x="333" y="35" text-anchor="middle" class="head">Client</text>
  <text x="579" y="35" text-anchor="middle" class="head">Switch</text>
  <text x="825" y="35" text-anchor="middle" class="head">Router</text>
  <text x="1071" y="35" text-anchor="middle" class="head">Internet link</text>
  <text x="1317" y="35" text-anchor="middle" class="head">Server</text>

  <text x="25" y="84" class="body">Application</text>
  <text x="25" y="129" class="body">Transport</text>
  <text x="25" y="174" class="body">Network</text>
  <text x="25" y="219" class="body">Link</text>
  <text x="25" y="264" class="body">Physical</text>

  <rect x="230" y="65" width="206" height="26" rx="8" fill="#173a56"/><text x="333" y="83" text-anchor="middle" class="cell white">HTTP</text>
  <rect x="230" y="110" width="206" height="26" rx="8" fill="#0f8b8d"/><text x="333" y="128" text-anchor="middle" class="cell white">TCP</text>
  <rect x="230" y="155" width="206" height="26" rx="8" fill="#537d99"/><text x="333" y="173" text-anchor="middle" class="cell white">IP</text>
  <rect x="230" y="200" width="206" height="26" rx="8" fill="#d6e6ed"/><text x="333" y="218" text-anchor="middle" class="cell">frame</text>
  <rect x="230" y="245" width="206" height="26" rx="8" fill="#edf2f4"/><text x="333" y="263" text-anchor="middle" class="cell">signals</text>

  <text x="579" y="84" text-anchor="middle" class="small">—</text><text x="579" y="129" text-anchor="middle" class="small">—</text><text x="579" y="174" text-anchor="middle" class="small">—</text>
  <rect x="476" y="200" width="206" height="26" rx="8" fill="#d6e6ed"/><text x="579" y="218" text-anchor="middle" class="cell">Ethernet frame</text>
  <rect x="476" y="245" width="206" height="26" rx="8" fill="#edf2f4"/><text x="579" y="263" text-anchor="middle" class="cell">signals</text>

  <text x="825" y="84" text-anchor="middle" class="small">—</text><text x="825" y="129" text-anchor="middle" class="small">—</text>
  <rect x="722" y="155" width="206" height="26" rx="8" fill="#537d99"/><text x="825" y="173" text-anchor="middle" class="cell white">IP packet</text>
  <rect x="722" y="200" width="206" height="26" rx="8" fill="#d6e6ed"/><text x="825" y="218" text-anchor="middle" class="cell">new link frame</text>
  <rect x="722" y="245" width="206" height="26" rx="8" fill="#edf2f4"/><text x="825" y="263" text-anchor="middle" class="cell">signals</text>

  <text x="1071" y="84" text-anchor="middle" class="small">—</text><text x="1071" y="129" text-anchor="middle" class="small">—</text>
  <rect x="968" y="155" width="206" height="26" rx="8" fill="#537d99"/><text x="1071" y="173" text-anchor="middle" class="cell white">IP packet</text>
  <rect x="968" y="200" width="206" height="26" rx="8" fill="#d6e6ed"/><text x="1071" y="218" text-anchor="middle" class="cell">link-specific frame</text>
  <rect x="968" y="245" width="206" height="26" rx="8" fill="#edf2f4"/><text x="1071" y="263" text-anchor="middle" class="cell">signals</text>

  <rect x="1214" y="65" width="206" height="26" rx="8" fill="#173a56"/><text x="1317" y="83" text-anchor="middle" class="cell white">HTTP</text>
  <rect x="1214" y="110" width="206" height="26" rx="8" fill="#0f8b8d"/><text x="1317" y="128" text-anchor="middle" class="cell white">TCP</text>
  <rect x="1214" y="155" width="206" height="26" rx="8" fill="#537d99"/><text x="1317" y="173" text-anchor="middle" class="cell white">IP</text>
  <rect x="1214" y="200" width="206" height="26" rx="8" fill="#d6e6ed"/><text x="1317" y="218" text-anchor="middle" class="cell">frame</text>
  <rect x="1214" y="245" width="206" height="26" rx="8" fill="#edf2f4"/><text x="1317" y="263" text-anchor="middle" class="cell">signals</text>
</g>

<rect x="80" y="880" width="1440" height="40" rx="12" fill="#e8f5f6"/>
<text x="800" y="906" text-anchor="middle" class="body"><tspan font-weight="750">Encapsulation:</tspan> HTTP data → TCP segment → IP packet → local frame → physical signal.</text>
</svg>