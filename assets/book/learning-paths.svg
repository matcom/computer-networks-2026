.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:13px}.white{fill:#fff}.teal{fill:#0f7f82}.blue{fill:#2b6e96}.orange{fill:#c96b1b}
.card{fill:#f8fbfc;stroke:#c6d7df;stroke-width:2}.soft{fill:#edf5f7}.navy{fill:#173a56}.rule{stroke:#8fa9b6;stroke-width:3}.thin{stroke:#9db2bc;stroke-width:2}
</style><rect width="1600" height="900" fill="#fff"/><text x="64" y="62" class="title">One Part I foundation, four professional lenses</text><text x="64" y="94" class="subtitle">The chapter order is shared. A learning path changes which questions, evidence sources, and optional challenges you emphasize.</text><defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6f8fa0"/></marker></defs><text x="64" y="150" class="section">Shared sequence</text><rect x="64" y="185" width="260" height="155" rx="18" fill="#f7fafb" stroke="#c6d7df" stroke-width="2"/><circle cx="98" cy="220" r="20" fill="#0f7f82"/><text x="98" y="227" class="label white" text-anchor="middle">0</text><text x="129" y="226" class="label">Workbench</text><text x="88" y="276" class="small">evidence • tools • baseline</text><rect x="88" y="300" width="212" height="16" rx="8" fill="#dbe9ee"/><line x1="324" y1="262" x2="356" y2="262" stroke="#6f8fa0" stroke-width="3" marker-end="url(#arr)"/><rect x="364" y="185" width="260" height="155" rx="18" fill="#f7fafb" stroke="#c6d7df" stroke-width="2"/><circle cx="398" cy="220" r="20" fill="#0f7f82"/><text x="398" y="227" class="label white" text-anchor="middle">1</text><text x="429" y="226" class="label">Internet architecture</text><text x="388" y="276" class="small">endpoints • layers • routers</text><rect x="388" y="300" width="212" height="16" rx="8" fill="#dbe9ee"/><line x1="624" y1="262" x2="656" y2="262" stroke="#6f8fa0" stroke-width="3" marker-end="url(#arr)"/><rect x="664" y="185" width="260" height="155" rx="18" fill="#f7fafb" stroke="#c6d7df" stroke-width="2"/><circle cx="698" cy="220" r="20" fill="#0f7f82"/><text x="698" y="227" class="label white" text-anchor="middle">2</text><text x="729" y="226" class="label">Physical layer</text><text x="688" y="276" class="small">signals • media • limits</text><rect x="688" y="300" width="212" height="16" rx="8" fill="#dbe9ee"/><line x1="924" y1="262" x2="956" y2="262" stroke="#6f8fa0" stroke-width="3" marker-end="url(#arr)"/><rect x="964" y="185" width="260" height="155" rx="18" fill="#f7fafb" stroke="#c6d7df" stroke-width="2"/><circle cx="998" cy="220" r="20" fill="#0f7f82"/><text x="998" y="227" class="label white" text-anchor="middle">3</text><text x="1029" y="226" class="label">Performance</text><text x="988" y="276" class="small">delay • rate • queueing</text><rect x="988" y="300" width="212" height="16" rx="8" fill="#dbe9ee"/><line x1="1224" y1="262" x2="1256" y2="262" stroke="#6f8fa0" stroke-width="3" marker-end="url(#arr)"/><rect x="1264" y="185" width="260" height="155" rx="18" fill="#f7fafb" stroke="#c6d7df" stroke-width="2"/><circle cx="1298" cy="220" r="20" fill="#0f7f82"/><text x="1298" y="227" class="label white" text-anchor="middle">4</text><text x="1329" y="226" class="label">Ethernet / LANs</text><text x="1288" y="276" class="small">MAC • switching • ARP</text><rect x="1288" y="300" width="212" height="16" rx="8" fill="#dbe9ee"/><line x1="800" y1="350" x2="800" y2="405" stroke="#6f8fa0" stroke-width="4"/><text x="800" y="390" class="small" text-anchor="middle">same chapters • different emphasis</text><text x="64" y="430" class="section">Professional lenses</text><rect x="64" y="470" width="716" height="145" rx="18" fill="#e7f4f1" stroke="#c6d7df" stroke-width="2"/><rect x="86" y="492" width="12" height="101" rx="6" fill="#0f7f82"/><text x="122" y="518" class="section">White Hat Security</text><text x="122" y="552" class="body">What normal state looks like; what evidence would reveal</text><text x="122" y="578" class="body">spoofing, exposure, or interference.</text><rect x="820" y="470" width="716" height="145" rx="18" fill="#e9f2f8" stroke="#c6d7df" stroke-width="2"/><rect x="842" y="492" width="12" height="101" rx="6" fill="#2b6e96"/><text x="878" y="518" class="section">Sysadmin &amp; Operations</text><text x="878" y="552" class="body">Build baselines, isolate boundaries, and separate link,</text><text x="878" y="578" class="body">host, path, and load failures.</text><rect x="64" y="650" width="716" height="145" rx="18" fill="#f1eff8" stroke="#c6d7df" stroke-width="2"/><rect x="86" y="672" width="12" height="101" rx="6" fill="#66569b"/><text x="122" y="698" class="section">Software Engineer</text><text x="122" y="732" class="body">Connect application symptoms to endpoint state, local</text><text x="122" y="758" class="body">delivery, and performance constraints.</text><rect x="820" y="650" width="716" height="145" rx="18" fill="#fff3e8" stroke="#c6d7df" stroke-width="2"/><rect x="842" y="672" width="12" height="101" rx="6" fill="#c96b1b"/><text x="878" y="698" class="section">Networking Research</text><text x="878" y="732" class="body">Turn assumptions into controlled variables, measure</text><text x="878" y="758" class="body">evidence, and challenge the model.</text><rect x="64" y="830" width="1472" height="42" rx="12" fill="#e6f4f4" stroke="#b5d9d8" stroke-width="2"/><text x="800" y="858" class="body" text-anchor="middle">Choose a path to prioritize tools and challenges—not to skip the common Workbench + Part I foundation.</text></svg>