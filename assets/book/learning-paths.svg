<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Part I learning paths</title>
<desc id="desc">A common sequence of Workbench, Internet Architecture, Physical Layer, Network Performance, and Ethernet and Local Networks leads into four aligned professional lenses: White Hat Security, Sysadmin and Operations, Software Engineering, and Networking Research.</desc>
<style>
  text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:#183247}
  .title{font-size:34px;font-weight:760}.subtitle{font-size:18px;fill:#587181}
  .head{font-size:19px;font-weight:760}.body{font-size:15px}.small{font-size:13px;fill:#587181}.white{fill:#fff}
</style>
<rect width="1600" height="900" fill="#fff"/>
<text x="80" y="64" class="title">One Part I foundation, four professional lenses</text>
<text x="80" y="98" class="subtitle">The chapter order stays the same; each path emphasizes different questions, evidence sources, and optional challenges.</text>

<defs><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0l12 6-12 6z" fill="#527d91"/></marker></defs>

<text x="80" y="155" class="head">Shared sequence</text>
<line x1="170" y1="305" x2="1380" y2="305" stroke="#527d91" stroke-width="5" marker-end="url(#a)"/>

<!-- five equal sequence cards -->
<g transform="translate(80,185)">
  <rect width="250" height="220" rx="20" fill="#f7fafb" stroke="#cbdbe2" stroke-width="2"/>
  <circle cx="125" cy="55" r="34" fill="#173a56"/>
  <text x="125" y="64" text-anchor="middle" class="head white">&gt;_</text>
  <circle cx="125" cy="116" r="20" fill="#0f8b8d"/><text x="125" y="123" text-anchor="middle" class="head white">0</text>
  <text x="125" y="158" text-anchor="middle" class="head">Workbench</text>
  <text x="125" y="184" text-anchor="middle" class="small">evidence • tools • baseline</text>
</g>
<g transform="translate(370,185)">
  <rect width="250" height="220" rx="20" fill="#f7fafb" stroke="#cbdbe2" stroke-width="2"/>
  <circle cx="125" cy="55" r="34" fill="#dbeaf0" stroke="#2b6e96" stroke-width="3"/>
  <path d="M92 55h66M125 22c-18 18-18 48 0 66M125 22c18 18 18 48 0 66" fill="none" stroke="#2b6e96" stroke-width="3"/>
  <circle cx="125" cy="116" r="20" fill="#0f8b8d"/><text x="125" y="123" text-anchor="middle" class="head white">1</text>
  <text x="125" y="158" text-anchor="middle" class="head">Internet Architecture</text>
  <text x="125" y="184" text-anchor="middle" class="small">layers • endpoints • routers</text>
</g>
<g transform="translate(660,185)">
  <rect width="250" height="220" rx="20" fill="#f7fafb" stroke="#cbdbe2" stroke-width="2"/>
  <path d="M76 55c27-29 46 29 73 0s46 29 73 0" fill="none" stroke="#0f8b8d" stroke-width="8"/>
  <path d="M76 77c27 29 46-29 73 0s46-29 73 0" fill="none" stroke="#d97824" stroke-width="8"/>
  <circle cx="125" cy="116" r="20" fill="#0f8b8d"/><text x="125" y="123" text-anchor="middle" class="head white">2</text>
  <text x="125" y="158" text-anchor="middle" class="head">Physical Layer</text>
  <text x="125" y="184" text-anchor="middle" class="small">signals • media • limits</text>
</g>
<g transform="translate(950,185)">
  <rect width="250" height="220" rx="20" fill="#f7fafb" stroke="#cbdbe2" stroke-width="2"/>
  <path d="M82 80a44 44 0 0 1 86 0" fill="none" stroke="#2b6e96" stroke-width="9"/>
  <line x1="125" y1="80" x2="154" y2="48" stroke="#d97824" stroke-width="6" stroke-linecap="round"/>
  <circle cx="125" cy="80" r="7" fill="#183247"/>
  <circle cx="125" cy="116" r="20" fill="#0f8b8d"/><text x="125" y="123" text-anchor="middle" class="head white">3</text>
  <text x="125" y="158" text-anchor="middle" class="head">Performance</text>
  <text x="125" y="184" text-anchor="middle" class="small">delay • rate • queueing</text>
</g>
<g transform="translate(1240,185)">
  <rect width="250" height="220" rx="20" fill="#f7fafb" stroke="#cbdbe2" stroke-width="2"/>
  <rect x="75" y="42" width="100" height="58" rx="10" fill="#173a56"/>
  <g fill="#d8eef2"><rect x="88" y="61" width="16" height="16"/><rect x="110" y="61" width="16" height="16"/><rect x="132" y="61" width="16" height="16"/><rect x="154" y="61" width="10" height="16"/></g>
  <circle cx="125" cy="116" r="20" fill="#0f8b8d"/><text x="125" y="123" text-anchor="middle" class="head white">4</text>
  <text x="125" y="158" text-anchor="middle" class="head">Ethernet &amp; LANs</text>
  <text x="125" y="184" text-anchor="middle" class="small">MAC • switching • ARP</text>
</g>

<text x="80" y="475" class="head">Choose a professional lens</text>
<line x1="800" y1="420" x2="800" y2="500" stroke="#527d91" stroke-width="4"/>
<line x1="350" y1="500" x2="1250" y2="500" stroke="#527d91" stroke-width="4"/>

<!-- four aligned lens cards -->
<g transform="translate(80,530)">
  <line x1="170" y1="-30" x2="170" y2="0" stroke="#527d91" stroke-width="3"/>
  <rect width="340" height="230" rx="20" fill="#e7f5f2" stroke="#b7ddd5" stroke-width="2"/>
  <circle cx="58" cy="58" r="31" fill="#0f8b8d"/>
  <path d="M58 37l18 8v15c0 17-10 27-18 32-8-5-18-15-18-32V45z" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="105" y="46" class="head">White Hat Security</text>
  <text x="28" y="112" class="body">Ask what trustworthy “normal” evidence</text>
  <text x="28" y="138" class="body">looks like before calling something suspicious.</text>
  <rect x="28" y="166" width="284" height="42" rx="11" fill="#f5fbf9"/>
  <text x="170" y="192" text-anchor="middle" class="small">baseline • spoofing • exposure • visibility</text>
</g>

<g transform="translate(450,530)">
  <line x1="170" y1="-30" x2="170" y2="0" stroke="#527d91" stroke-width="3"/>
  <rect width="340" height="230" rx="20" fill="#eaf2f7" stroke="#c3d5e0" stroke-width="2"/>
  <circle cx="58" cy="58" r="31" fill="#2b6e96"/>
  <path d="M42 58h32M58 42v32M47 47l22 22M69 47 47 69" stroke="#fff" stroke-width="4"/>
  <text x="105" y="46" class="head">Sysadmin &amp; Operations</text>
  <text x="28" y="112" class="body">Build baselines, isolate boundaries, and</text>
  <text x="28" y="138" class="body">separate link, host, path, and load failures.</text>
  <rect x="28" y="166" width="284" height="42" rx="11" fill="#f6f9fb"/>
  <text x="170" y="192" text-anchor="middle" class="small">state • reachability • capture • performance</text>
</g>

<g transform="translate(820,530)">
  <line x1="170" y1="-30" x2="170" y2="0" stroke="#527d91" stroke-width="3"/>
  <rect width="340" height="230" rx="20" fill="#f1eef8" stroke="#d7cee8" stroke-width="2"/>
  <circle cx="58" cy="58" r="31" fill="#66569b"/>
  <text x="58" y="66" text-anchor="middle" class="head white">&lt;/&gt;</text>
  <text x="105" y="46" class="head">Software Engineer</text>
  <text x="28" y="112" class="body">Connect application symptoms to endpoint,</text>
  <text x="28" y="138" class="body">local-link, and performance constraints.</text>
  <rect x="28" y="166" width="284" height="42" rx="11" fill="#faf8fd"/>
  <text x="170" y="192" text-anchor="middle" class="small">APIs • sockets • latency • deployment</text>
</g>

<g transform="translate(1190,530)">
  <line x1="170" y1="-30" x2="170" y2="0" stroke="#527d91" stroke-width="3"/>
  <rect width="330" height="230" rx="20" fill="#fff3e8" stroke="#ead3bd" stroke-width="2"/>
  <circle cx="58" cy="58" r="31" fill="#d97824"/>
  <path d="M40 69h12l7-30 10 48 8-28h13" fill="none" stroke="#fff" stroke-width="4"/>
  <text x="105" y="46" class="head">Networking Research</text>
  <text x="28" y="112" class="body">Turn assumptions into controlled variables,</text>
  <text x="28" y="138" class="body">then test the model against evidence.</text>
  <rect x="28" y="166" width="274" height="42" rx="11" fill="#fffaf5"/>
  <text x="165" y="192" text-anchor="middle" class="small">models • experiments • measurement • limits</text>
</g>

<rect x="80" y="815" width="1440" height="48" rx="14" fill="#e8f5f6"/>
<text x="800" y="846" text-anchor="middle" class="body"><tspan font-weight="750">Same foundation:</tspan> paths change emphasis, not the required Workbench + Part I sequence.</text>
</svg>