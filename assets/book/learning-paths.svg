<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc"><title id="title">Part I networking learning paths</title><desc id="desc">A shared five-step foundation followed by four professional lenses.</desc>
